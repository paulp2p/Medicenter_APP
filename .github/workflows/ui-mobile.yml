name: Android emulator smoke (boot + screenshot)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest      # Runner hospedado por GitHub (VM efímera)
    timeout-minutes: 60         # Límite total del job

    steps:
      # 1) Obtener el repo (necesario aunque no usemos archivos)
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Java para herramientas del SDK (adb, sdkmanager)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3) Levantar emulador, abrir URL y capturar pantalla
      - name: Boot emulator, open URL, screenshot
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: '-no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none'
          disable-animations: true
          script: |
            adb wait-for-device
            # Esperar arranque completo
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 1; done
            # Desbloquear pantalla
            adb shell input keyevent 82
            # Abrir navegador a Google Argentina (elige el browser disponible)
            adb shell am start -a android.intent.action.VIEW -d 'https://www.google.com.ar'
            # Dar tiempo a que cargue
            sleep 8
            # Captura de pantalla -> workspace
            adb exec-out screencap -p > $GITHUB_WORKSPACE/emulator-screenshot.png
            # Info del dispositivo como evidencia adicional
            {
              echo "MODEL: $(adb shell getprop ro.product.model)"
              echo "ANDROID: $(adb shell getprop ro.build.version.release) (SDK $(adb shell getprop ro.build.version.sdk))"
              echo "BOOT_COMPLETED: $(adb shell getprop sys.boot_completed)"
            } | tee $GITHUB_WORKSPACE/adb-device-info.txt

      # 4) Subir evidencia (screenshot + info)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            emulator-screenshot.png
            adb-device-info.txt
