name: Android Behave Tests (APK desde Drive, Ubuntu sin Play Store)

on:
  workflow_dispatch:
    inputs:
      behave_tags:
        description: 'Etiquetas Behave (ej: @smoke, @regression) — opcional'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
  API_LEVEL: 30
  AVD_NAME: ci-pixel5-api30
  DEVICE_PROFILE: pixel_5
  APK_LOCAL_NAME: medicenter_app.apk
  PY_VERSION: "3.11"

  # Appium
  USE_APPIUM: "true"
  APPIUM_HOST: "127.0.0.1"
  APPIUM_PORT: "4723"

  # Google Drive / rclone
  RCLONE_REMOTE: "gdrive"
  GDRIVE_APK_PATH: "CI/medicenter_app.apk"

  # App bajo prueba
  APP_PACKAGE: "com.siltium.medicenter"
  APP_ACTIVITY: "com.siltium.medicenter.MainActivity"

  # Driver factory hints
  APP_WAIT_DURATION: "180000"
  APP_WAIT_ACTIVITY: "com.siltium.medicenter.*"

jobs:
  android-behave:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (Appium)
        if: env.USE_APPIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          set -eux
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install behave selenium appium-python-client allure-behave
          fi

      # ---------- RCLONE ----------
      - name: Instalar rclone
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y rclone netcat-openbsd curl

      - name: Configurar rclone (desde secreto base64)
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          set -euo pipefail
          [ -n "${RCLONE_CONF_B64:-}" ] || { echo "Falta secrets.RCLONE_CONF_B64"; exit 1; }
          mkdir -p ~/.config/rclone
          CLEAN="$(printf '%s' "$RCLONE_CONF_B64" | tr -d '\r\n\t ' )"
          PAD=$(( (4 - (${#CLEAN} % 4)) % 4 ))
          if [ $PAD -gt 0 ]; then CLEAN="${CLEAN}$(printf '=%.0s' $(seq 1 $PAD))"; fi
          printf '%s' "$CLEAN" | base64 -d > ~/.config/rclone/rclone.conf
          rclone version
          rclone listremotes

      - name: "Smoke test: descarga de APK"
        run: |
          set -eux
          rclone ls "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}"
          rclone copyto "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}" "${APK_LOCAL_NAME}"
          ls -lh "${APK_LOCAL_NAME}"

      # ---------- LIBRERÍAS DEL EMULADOR ----------
      - name: Instalar dependencias del emulador (libs)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            libpulse0 libasound2t64 libnss3 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 \
            libxkbcommon0 libxdamage1 libxfixes3 libxrender1 \
            libgl1 libgles2 libvulkan1 mesa-vulkan-drivers libdrm2 libxshmfence1 libgbm1 \
            libfontconfig1 ca-certificates

      # ---------- ANDROID SDK + EMULADOR ----------
      - name: Instalar Android SDK (cmdline-tools) y componentes
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools
          unzip -q cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm -f cmdline-tools.zip

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"

          # IMPORTANTE: imagen AOSP SIN Google APIs
          ( yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null ) || true
          ( yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
              "platform-tools" "emulator" "platforms;android-${API_LEVEL}" \
              "build-tools;30.0.3" \
              "system-images;android-${API_LEVEL};default;x86_64" ) || true

          # Symlink opcional
          sudo mkdir -p /usr/local/lib/android
          [ -e /usr/local/lib/android/sdk ] || sudo ln -s "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk

          ls -la "$ANDROID_SDK_ROOT/system-images/android-${API_LEVEL}/default/x86_64" || exit 1
          adb version
          emulator -version

      - name: Crear AVD (AOSP default; sin GMS)
        run: |
          set -eux
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes "no" | avdmanager create avd \
            -n "$AVD_NAME" -k "system-images;android-${API_LEVEL};default;x86_64" \
            -d "$DEVICE_PROFILE" --force
          AVD_CFG="$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"
          {
            echo "hw.cpu.ncore=3"
            echo "hw.ramSize=3072"
            echo "vm.heapSize=512"
            echo "tag.id=default"
            echo "abi.type=x86_64"
            echo "image.sysdir.1=$ANDROID_SDK_ROOT/system-images/android-${API_LEVEL}/default/x86_64"
            echo "hw.gpu.mode=swiftshader_indirect"
            echo "hw.gpu.enabled=yes"
            echo "disk.dataPartition.size=4096M"
          } >> "$AVD_CFG"

      - name: Iniciar emulador (headless, sin KVM) y gate robusto
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          export ANDROID_EMULATOR_USE_SYSTEM_LIBS=1
          export ADB_VENDOR_KEYS=
          : > emulator.log

          # Hosted Ubuntu => sin KVM: -accel off + SwiftShader
          nohup emulator -avd "$AVD_NAME" \
            -no-window -no-boot-anim -no-snapshot \
            -accel off -no-metrics \
            -gpu swiftshader_indirect -noaudio -camera-back none -camera-front none \
            -port 5554 -ports 5554,5555 > emulator.log 2>&1 &

          adb start-server
          timeout 180s bash -c 'until adb -s emulator-5554 get-state 2>/dev/null; do sleep 2; done'

          # Gate robusto: framework + PackageManager respondiendo
          deadline=$((SECONDS+600))
          until adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -q 1 && \
                adb -s emulator-5554 shell "cmd package list packages >/dev/null 2>&1"; do
            [ $SECONDS -lt $deadline ] || { echo "[boot] timeout esperando framework/pm"; tail -n +200 emulator.log || true; exit 1; }
            sleep 2
          done

          echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"

      - name: "Watchdog: cerrar diálogos del sistema (no bloqueante)"
        run: |
          set -eux
          dev="emulator-5554"
          nohup bash -c '
            while true; do
              adb -s '"$dev"' shell "am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS" >/dev/null 2>&1 || true
              sleep 3
            done
          ' > watchdog.log 2>&1 &

      - name: Desbloquear, desactivar animaciones y silenciar notificaciones
        run: |
          set -eux
          dev="emulator-5554"
          adb -s $dev shell input keyevent 224 || true
          adb -s $dev shell wm dismiss-keyguard || true
          adb -s $dev shell input keyevent 82 || true
          adb -s $dev shell input keyevent 3  || true

          # Asegurar servicios base primero
          for i in $(seq 1 60); do adb -s $dev shell 'pm path android' >/dev/null 2>&1 && break || sleep 2; done
          for i in $(seq 1 60); do adb -s $dev shell 'settings list system' >/dev/null 2>&1 && break || sleep 2; done

          adb -s $dev shell settings put global window_animation_scale 0 || true
          adb -s $dev shell settings put global transition_animation_scale 0 || true
          adb -s $dev shell settings put global animator_duration_scale 0 || true
          adb -s $dev shell svc power stayon true || true

          # Evitar overlays que tapen el anchor
          adb -s $dev shell settings put global heads_up_notifications_enabled 0 || true
          adb -s $dev shell cmd statusbar collapse || true

      - name: Instalar y arrancar Appium
        if: env.USE_APPIUM == 'true'
        run: |
          set -euxo pipefail
          NPM_BIN="$(npm root -g)/.bin"
          [ -d "$NPM_BIN" ] && echo "$NPM_BIN" >> "$GITHUB_PATH" || true
          node -v; npm -v
          npm i -g appium@3 appium-uiautomator2-driver@latest
          appium --version
          appium driver install uiautomator2 || true
          command -v fuser >/dev/null 2>&1 && fuser -k 4723/tcp || true
          command -v lsof  >/dev/null 2>&1 && lsof -ti tcp:4723 | xargs -r kill -9 || true
          : > appium.log
          nohup appium --relaxed-security --allow-insecure=adb_shell \
            --address "$APPIUM_HOST" --port "$APPIUM_PORT" > appium.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS "http://$APPIUM_HOST:$APPIUM_PORT/status" >/dev/null && break || true
            pgrep -f "appium .*--port $APPIUM_PORT" >/dev/null || { echo "Appium se detuvo"; sed -n '1,400p' appium.log || true; exit 1; }
            sleep 1
          done

      - name: Instalar APK en el emulador (robusto)
        shell: bash
        run: |
          set -euxo pipefail
          dev="emulator-5554"

          # Higiene y uninstall previa
          adb -s "$dev" shell settings put global verifier_verify_adb_installs 0 || true
          if [ -n "${APP_PACKAGE:-}" ]; then
            adb -s "$dev" shell "am force-stop ${APP_PACKAGE}" || true
            adb -s "$dev" shell "pm clear ${APP_PACKAGE}" || true
            adb -s "$dev" uninstall "${APP_PACKAGE}" || true
          fi

          # Install normal y fallback por "package session"
          if ! adb -s "$dev" install -r -d -t "${APK_LOCAL_NAME}" | tee adb-install.log; then
            echo "Instalación streamed falló; usando package session…"
            adb -s "$dev" push -p "${APK_LOCAL_NAME}" /data/local/tmp/app-under-test.apk
            sess="$(adb -s "$dev" shell 'cmd package install-create -r -d -t' | sed -n 's/.*\[\(.*\)\].*/\1/p' || true)"
            [ -n "$sess" ] || { echo "No se pudo crear sesión de instalación"; exit 1; }
            adb -s "$dev" shell "cmd package install-write ${sess} base /data/local/tmp/app-under-test.apk"
            adb -s "$dev" shell "cmd package install-commit ${sess}"
          fi

          # Colapsar notificaciones antes de tests
          adb -s "$dev" shell cmd statusbar collapse || true

      - name: (Opcional) Preinstalar io.appium.settings
        run: |
          set -eux
          dev="emulator-5554"
          SETTINGS_APK="$HOME/.appium/node_modules/appium-uiautomator2-driver/node_modules/io.appium.settings/apks/settings_apk-debug.apk"
          test -f "$SETTINGS_APK" && adb -s "$dev" install -r "$SETTINGS_APK" || true

      - name: Ejecutar tests (Behave)
        if: env.USE_APPIUM == 'true'
        timeout-minutes: 55
        env:
          DEVICE_NAME: "emulator-5554"
          PLATFORM_NAME: "Android"
          AUTOMATION_NAME: "UiAutomator2"
          APPIUM_SERVER_URL: "http://${{ env.APPIUM_HOST }}:${{ env.APPIUM_PORT }}"
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
          APP_ACTIVITY: ${{ env.APP_ACTIVITY }}
        run: |
          set -eux
          export UDID="emulator-5554"
          export APP="${APK_LOCAL_NAME}"
          export ANDROID_INSTALL_TIMEOUT=600000
          export NO_RESET=true
          export ENFORCE_APP_INSTALL=false
          export ADB_EXEC_TIMEOUT=300000
          export UIA2_INSTALL_TIMEOUT=300000
          export UIA2_LAUNCH_TIMEOUT=300000

          mkdir -p reports/allure-results
          if [ -n "${{ github.event.inputs.behave_tags }}" ]; then
            behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results -t "${{ github.event.inputs.behave_tags }}"
          else
            behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results
          fi

      - name: Capturar logcat para diagnóstico (no bloqueante)
        if: always()
        run: |
          set -euxo pipefail
          dev="emulator-5554"
          : > logcat.txt
          timeout 60s adb -s "$dev" logcat -d -b all -v threadtime -T 10m >> logcat.txt || {
            echo "[logcat] timeout/err; intento corto -t 2000" | tee -a logcat.txt
            timeout 20s adb -s "$dev" logcat -d -t 2000 -v threadtime >> logcat.txt || true
          }

      - name: Subir artefactos (Allure, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          path: |
            reports/allure-results/**
            appium.log
            adb-install.log
            emulator.log
            logcat.txt
            watchdog.log
          if-no-files-found: warn
          retention-days: 7

      - name: Apagar emulador y limpiar
        if: always()
        run: |
          set -eux
          adb -s emulator-5554 emu kill || true
          pkill -f "emulator" || true
          pkill -f "appium" || true
          adb kill-server || true
