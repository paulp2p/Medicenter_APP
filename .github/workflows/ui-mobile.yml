name: Android UI Tests (Medicenter)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: medicenter-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # App & APK
      APP_PACKAGE: com.siltium.medicenter
      APP_ACTIVITY: com.siltium.medicenter.MainActivity
      APK_LOCAL_PATH: CI/medicenter_app.apk
      APP: ${{ github.workspace }}/CI/medicenter_app.apk  # usado por tu framework vía capability 'app'

      # Framework toggles (ajusta si hace falta)
      APPIUM_LOG_LEVEL: info
      LOCALE: en-US

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: MEDICENTER_APP/requirements.txt

      - name: Install Python deps
        working-directory: MEDICENTER_APP
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-behave

      - name: Install Appium v3 + UIAutomator2
        run: |
          npm i -g appium@3 || npm i -g appium@latest
          appium driver install uiautomator2
          appium -v

      - name: Install rclone
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y rclone

      - name: Download APK from Google Drive (Service Account)
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }} # ej: CI/medicenter_app.apk
        run: |
          mkdir -p CI
          if [ -z "${GDRIVE_FILE_PATH}" ]; then
            echo "GDRIVE_FILE_PATH secret vacío (ej: CI/medicenter_app.apk)"; exit 1
          fi
          rclone copy "gdrive:${GDRIVE_FILE_PATH}" "CI/" --progress
          ls -l CI
          test -f "$APK_LOCAL_PATH" || { echo "APK no encontrado en $APK_LOCAL_PATH"; exit 1; }

      - name: Run emulator & tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            echo "Locale actual:"
            adb shell getprop persist.sys.locale || true

            # Inicia Appium y espera puerto 4723
            appium --log-level ${APPIUM_LOG_LEVEL:-info} > appium.log 2>&1 &
            for i in $(seq 1 90); do
              if lsof -i :4723 >/dev/null 2>&1; then echo "Appium listo"; break; fi
              [ $i -eq 90 ] && echo "Appium no inició a tiempo" && exit 1
              sleep 1
            done

            # Ejecutar tests (Behave + Allure) en carpeta del proyecto
            cd MEDICENTER_APP
            mkdir -p allure-results
            set +e
            behave -f allure_behave.formatter:AllureFormatter -o allure-results
            EXIT_CODE=$?
            set -e

            # Logs
            cd "$GITHUB_WORKSPACE"
            adb logcat -d > logcat.txt || true
            exit ${EXIT_CODE:-0}

      - name: Upload artifacts (Allure, logs, screenshots, Appium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          retention-days: 7
          path: |
            MEDICENTER_APP/allure-results/**
            **/screenshots/**
            appium.log
            logcat.txt

      - name: Notify Slack (optional)
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="Medicenter Android UI Tests: ${STATUS} - ${RUN_URL}"
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"${MSG}\"}" "$SLACK_WEBHOOK_URL"
