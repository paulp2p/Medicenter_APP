name: Android UI Tests (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  e2e-android-win:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      APPIUM_LOG_LEVEL: info
      # Ruta al APK para capability 'app' (Windows usa '\')
      APP: ${{ github.workspace }}\CI\medicenter_app.apk
      APP_PACKAGE: com.siltium.medicenter
      APP_ACTIVITY: com.siltium.medicenter.MainActivity
      LANGUAGE: en
      LOCALE: US

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt
            **/pyproject.toml

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-behave

      - name: Install Appium v3 + UIAutomator2
        shell: bash
        run: |
          npm i -g appium@3 || npm i -g appium@latest
          appium driver install uiautomator2
          appium -v

      # === Android SDK (CLI tools) ===
      - name: Setup Android CLI tools
        uses: android-actions/setup-android@v3

      - name: Install platform tools, emulator & system image (API 30)
        shell: bash
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "emulator" "platforms;android-30" "system-images;android-30;google_apis;x86_64"
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --device "pixel_5" --force

      # === Descargar APK desde Google Drive ===
      - name: Download APK from Google Drive (Service Account)
        shell: powershell
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }}  # ej: CI/medicenter_app.apk
        run: |
          choco install -y rclone
          New-Item -ItemType Directory -Force -Path CI | Out-Null
          rclone copy "gdrive:${env:GDRIVE_FILE_PATH}" CI/
          Write-Host "Contenido de CI:"
          Get-ChildItem CI -Force
          if (!(Test-Path "${{ env.APP }}")) { throw "APK no encontrado en ${{ env.APP }}" }

      # === Emulador + Appium + Behave ===
      - name: Start emulator + Appium + run tests
        shell: powershell
        run: |
          # Resolver ruta del SDK (la acción setea ANDROID_HOME)
          $SDK = $env:ANDROID_SDK_ROOT
          if (-not $SDK) { $SDK = $env:ANDROID_HOME }
          if (-not $SDK) { throw "No se detectó ANDROID_HOME/ANDROID_SDK_ROOT" }

          Write-Host "ANDROID SDK: $SDK"

          # Arrancar emulador (sin aceleración HW, headless)
          $emu = Start-Process -FilePath "$SDK\emulator\emulator.exe" `
                 -ArgumentList "-avd test -no-window -no-snapshot -no-boot-anim -no-audio -gpu swiftshader_indirect -accel off" `
                 -PassThru

          # ADB server y esperar boot completo
          & "$SDK\platform-tools\adb.exe" start-server
          $max=240
          for ($i=0; $i -lt $max; $i++) {
            $state = & "$SDK\platform-tools\adb.exe" get-state 2>$null
            $boot  = & "$SDK\platform-tools\adb.exe" shell getprop sys.boot_completed 2>$null
            if ($state -match "device" -and $boot -match "1") { break }
            Start-Sleep -Seconds 2
          }

          # Desactivar animaciones (best-effort)
          & "$SDK\platform-tools\adb.exe" shell settings put global window_animation_scale 0 2>$null
          & "$SDK\platform-tools\adb.exe" shell settings put global transition_animation_scale 0 2>$null
          & "$SDK\platform-tools\adb.exe" shell settings put global animator_duration_scale 0 2>$null

          # Verificar APK
          Write-Host "APP env: $env:APP"
          if (!(Test-Path "$env:APP")) { throw "APK no existe en $env:APP" }

          # Iniciar Appium y esperar puerto 4723
          $appium = Start-Process -FilePath "appium" -ArgumentList "--log-level $env:APPIUM_LOG_LEVEL" `
                     -NoNewWindow -RedirectStandardOutput "appium.log" -RedirectStandardError "appium.log" -PassThru
          for ($i=0; $i -lt 120; $i++) {
            if (Test-NetConnection -ComputerName "localhost" -Port 4723 -InformationLevel Quiet) { break }
            Start-Sleep -Seconds 1
          }

          # Ejecutar tests (Allure en ./allure-results)
          New-Item -ItemType Directory -Force -Path allure-results | Out-Null
          $env:PYTHONIOENCODING="utf-8"
          python -m behave -f allure_behave.formatter:AllureFormatter -o allure-results
          $LASTEXITCODE > .behave_exit_code

          # Logcat
          & "$SDK\platform-tools\adb.exe" logcat -d > logcat.txt 2>$null

          # Cierre best-effort
          if ($appium -ne $null) { Stop-Process -Id $appium.Id -Force -ErrorAction SilentlyContinue }
          & "$SDK\platform-tools\adb.exe" emu kill 2>$null

      - name: Fail job if tests failed
        shell: bash
        run: |
          CODE=$(cat .behave_exit_code 2>/dev/null || echo 0)
          echo "behave exit code: $CODE"
          exit $CODE

      - name: Upload artifacts (Allure, logs, screenshots, Appium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          retention-days: 7
          path: |
            allure-results/**
            **/screenshots/**
            appium.log
            logcat.txt
          if-no-files-found: warn
