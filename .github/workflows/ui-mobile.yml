name: Android env + emulator smoke (no APK)

on:
  workflow_dispatch:

jobs:
  env-and-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1) Traer el repo (opcional, pero buena práctica)
      - name: Checkout
        uses: actions/checkout@v4

      # 2) SO: Java / Node / Python (versiones pedidas)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3) Appium + Doctor + driver UiAutomator2
      - name: Install Appium & tools
        run: |
          set -eu
          npm i -g appium @appium/doctor --no-audit --no-fund
          appium driver install uiautomator2
          {
            echo "JAVA: $(java -version 2>&1 | head -n1)"
            echo "NODE: $(node -v)"
            echo "NPM:  $(npm -v)"
            echo "PY:   $(python --version 2>&1)"
            echo "APPIUM: $(appium -v)"
          } | tee env-versions.txt
          appium-doctor --android | tee appium_doctor.txt || true

      # 4) (Opcional) Exponer rutas del SDK en PATH para próximos steps de este job
      - name: Export ANDROID_SDK_ROOT and PATH
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          {
            echo "/usr/local/lib/android/sdk/platform-tools"
            echo "/usr/local/lib/android/sdk/emulator"
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin"
          } >> "$GITHUB_PATH"

      # 5) Emulador: boot y recolección de logs (NO instala ni abre apps)
      - name: Boot emulator (API 30) and collect logs
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true          # el teardown del emu a veces emite warning/exit; validamos luego
        with:
          api-level: 30
          target: google_apis_playstore  # imagen con Chrome preinstalado (según tu requisito)
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          # Arranque limpio/headless
          emulator-options: >
            -no-window -no-boot-anim
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          disable-animations: false
          script: |
            # Importante: el action ejecuta cada línea en /bin/sh; evitar variables entre líneas.
            set -eu
            # Esperar que Android quede listo
            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 1; done
            adb shell 'until [ "$(getprop init.svc.bootanim)" = "stopped" ] || [ -z "$(getprop init.svc.bootanim)" ]; do sleep 1; done' || true
            # Evidencia básica del emulador
            adb version | tee "$GITHUB_WORKSPACE/adb_version.txt"
            {
              echo "BOOT_OK=1"
              echo "SERIAL=$(adb get-serialno | tr -d '\r')"
              echo "MODEL=$(adb shell getprop ro.product.model | tr -d '\r')"
              echo "ANDROID=$(adb shell getprop ro.build.version.release | tr -d '\r')"
              echo "SDK=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              echo "ABI=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
              echo "ABILIST=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
              echo "BOOT_COMPLETED=$(adb shell getprop sys.boot_completed | tr -d '\r')"
              echo "TARGET=google_apis_playstore; API=30; ARCH=x86_64; PROFILE=pixel_5"
            } | tee "$GITHUB_WORKSPACE/emulator-boot.log"
            # Últimas líneas de logcat (útil como smoke)
            adb logcat -d -t 200 > "$GITHUB_WORKSPACE/logcat_tail.txt" || true

      # 6) Validación mínima (falla si el emulador no booteó)
      - name: Validate boot evidence
        run: |
          set -eu
          test -s env-versions.txt || (echo "Falta env-versions.txt" && exit 1)
          test -s appium_doctor.txt || (echo "Falta appium_doctor.txt" && exit 1)
          test -s adb_version.txt || (echo "Falta adb_version.txt" && exit 1)
          grep -q "BOOT_OK=1" emulator-boot.log || (echo "Emulador no booteó correctamente" && exit 1)
          echo "OK: entorno instalado y emulador booteado."

      # 7) Artefactos: descarga los logs para inspección local
      - name: Upload artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-and-emulator-logs
          path: |
            env-versions.txt
            appium_doctor.txt
            adb_version.txt
            emulator-boot.log
            logcat_tail.txt
