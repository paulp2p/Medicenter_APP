name: Android emulator smoke (solo boot, robusto)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: emulator-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-only:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Boot emulator (API 30) and collect logs
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: google_apis          # <- más liviana que Play Store
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          # dar más tiempo al boot (ms). default ~600000
          emulator-boot-timeout: 1800000
          # hardware más liviano
          cores: 2
          ram-size: 2048
          heap-size: 384
          disk-size: 8G
          # flags para CI sin GPU/sonido/cámaras/snapshot
          emulator-options: >
            -no-window -no-boot-anim -no-audio
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          disable-animations: false
          script: |
            set -eu
            # Si llegamos aquí, el emu ya está arriba.
            adb version | tee "$GITHUB_WORKSPACE/adb_version.txt" || true
            echo "SCRIPT_STARTED=1" > "$GITHUB_WORKSPACE/emulator-script.log"

            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 1; done
            adb shell 'until [ "$(getprop init.svc.bootanim)" = "stopped" ] || [ -z "$(getprop init.svc.bootanim)" ]; do sleep 1; done' || true

            {
              echo "BOOT_OK=1"
              echo "SERIAL=$(adb get-serialno | tr -d '\r')"
              echo "MODEL=$(adb shell getprop ro.product.model | tr -d '\r')"
              echo "ANDROID=$(adb shell getprop ro.build.version.release | tr -d '\r')"
              echo "SDK=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              echo "ABI=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
              echo "ABILIST=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
              echo "TARGET=google_apis; API=30; ARCH=x86_64; PROFILE=pixel_5"
            } | tee "$GITHUB_WORKSPACE/emulator-boot.log"

            adb logcat -d -t 200 > "$GITHUB_WORKSPACE/logcat_tail.txt" || true

      - name: Validate boot evidence
        run: |
          set -eu
          if [ ! -s emulator-script.log ]; then
            echo "ERROR: el action nunca llegó a ejecutar 'script:' (timeout de boot interno)."
            exit 1
          fi
          test -s emulator-boot.log || (echo "ERROR: no se generó emulator-boot.log" && exit 1)
          grep -q "BOOT_OK=1" emulator-boot.log || (echo "ERROR: el emulador no reportó boot completo" && exit 1)
          echo "OK: emulador instalado y booteado."

      - name: Upload artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-only-logs
          path: |
            emulator-script.log
            adb_version.txt
            emulator-boot.log
            logcat_tail.txt
