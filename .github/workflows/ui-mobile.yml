name: Emulator smoke (fix ADB first)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: emulator-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-only:
    runs-on: ubuntu-latest            # si es macOS: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      # 1) Levantar ADB ANTES del action (evita "Unable to connect to adb daemon on port: 5037")
      - name: Warm up ADB daemon
        run: |
          set -eux
          ADB=/usr/local/lib/android/sdk/platform-tools/adb
          $ADB kill-server || true
          $ADB start-server
          $ADB version
          $ADB devices -l || true

      # 2) Arrancar emulador (el action ya encontrará ADB vivo)
      - name: Boot emulator and collect logs
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true
        env:
          # Mantener ambos en el mismo puerto (por si el emulador mira esta var)
          ADB_SERVER_PORT: 5037
          ANDROID_ADB_SERVER_PORT: 5037
        with:
          api-level: 30
          target: google_apis
          arch: x86_64                 # si es macOS (Apple Silicon): arm64-v8a y mejor api-level: 33
          profile: pixel_5
          force-avd-creation: true
          emulator-boot-timeout: 1800000
          emulator-options: >
            -no-window -no-boot-anim -no-audio
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data
            -accel off                          # en Ubuntu CI es lo más estable
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
            -verbose
          disable-animations: false
          script: |
            set -eu
            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 1; done
            adb shell 'until [ "$(getprop init.svc.bootanim)" = "stopped" ] || [ -z "$(getprop init.svc.bootanim)" ]; do sleep 1; done' || true

            adb version | tee "$GITHUB_WORKSPACE/adb_version.txt" || true
            {
              echo "BOOT_OK=1"
              echo "SERIAL=$(adb get-serialno | tr -d '\r')"
              echo "MODEL=$(adb shell getprop ro.product.model | tr -d '\r')"
              echo "ANDROID=$(adb shell getprop ro.build.version.release | tr -d '\r')"
              echo "SDK=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              echo "ABI=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
            } | tee "$GITHUB_WORKSPACE/emulator-boot.log"

            adb devices -l | tee "$GITHUB_WORKSPACE/adb_devices.txt" || true
            adb logcat -d -t 200 > "$GITHUB_WORKSPACE/logcat_tail.txt" || true

      - name: Validate boot
        run: |
          set -eu
          test -s adb_version.txt || (echo "Falta adb_version.txt" && exit 1)
          test -s emulator-boot.log || (echo "Falta emulator-boot.log" && exit 1)
          grep -q "BOOT_OK=1" emulator-boot.log || (echo "No hubo boot completo" && exit 1)
          echo "OK: emulador booteado y ADB operativo."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs
          path: |
            adb_version.txt
            adb_devices.txt
            emulator-boot.log
            logcat_tail.txt
