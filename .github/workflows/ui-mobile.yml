name: Emulator smoke • Ubuntu x86_64 (robusto)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: emulator-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Boot emulator (API 30 • x86_64 no-accel) and collect logs
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-boot-timeout: 1800000          # 30 min si descarga imagen
          cores: 2
          ram-size: 2048
          heap-size: 384
          disk-size: 8G
          emulator-options: >
            -no-window -no-boot-anim -no-audio
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data
            -accel off                      # ← fuerza sin KVM, más confiable
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
            -verbose
          disable-animations: false
          script: |
            set -eu
            echo "SCRIPT_STARTED=1" > "$GITHUB_WORKSPACE/emulator-script.log"
            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 1; done
            adb shell 'until [ "$(getprop init.svc.bootanim)" = "stopped" ] || [ -z "$(getprop init.svc.bootanim)" ]; do sleep 1; done' || true
            {
              echo "BOOT_OK=1"
              echo "MODEL=$(adb shell getprop ro.product.model)"
              echo "ANDROID=$(adb shell getprop ro.build.version.release)"
              echo "SDK=$(adb shell getprop ro.build.version.sdk)"
              echo "ABI=$(adb shell getprop ro.product.cpu.abi)"
              echo "TARGET=google_apis; API=30; ARCH=x86_64"
            } | tee "$GITHUB_WORKSPACE/emulator-boot.log"
            adb logcat -d -t 150 > "$GITHUB_WORKSPACE/logcat_tail.txt" || true

      - name: Validate boot
        run: |
          set -eu
          [ -s emulator-script.log ] || { echo "El action nunca llegó a ejecutar script (timeout antes del boot)."; exit 1; }
          [ -s emulator-boot.log ] || { echo "Sin emulator-boot.log"; exit 1; }
          grep -q "BOOT_OK=1" emulator-boot.log || { echo "No hubo boot completo"; exit 1; }
          echo "OK: emulador x86_64 booteado en Ubuntu."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs-ubuntu
          path: |
            emulator-script.log
            emulator-boot.log
            logcat_tail.txt
