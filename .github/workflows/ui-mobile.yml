name: Emulator smoke (ADB port fix)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: emulator-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-only:
    runs-on: ubuntu-latest      # macOS: usa macos-14 y arch: arm64-v8a
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Boot emulator (API 30) and collect logs
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true
        env:
          # >>> clave: evitar el 5037 que a veces queda colgado
          ADB_SERVER_PORT: 5038
        with:
          api-level: 30
          target: google_apis              # (en macOS puedes subir a api-level: 33)
          arch: x86_64                     # macOS: arch: arm64-v8a
          profile: pixel_5
          force-avd-creation: true
          emulator-boot-timeout: 1800000   # 30 min si descarga imagen
          cores: 2
          ram-size: 2048
          heap-size: 384
          disk-size: 8G
          emulator-options: >
            -no-window -no-boot-anim -no-audio
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data
            -accel off                      # estable en Ubuntu CI
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
            -verbose
          disable-animations: false
          script: |
            set -eu
            # ADB a puerto propio y server limpio
            adb kill-server || true
            adb start-server
            adb version | tee "$GITHUB_WORKSPACE/adb_version.txt"

            # Esperar emulador y boot real
            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 1; done
            adb shell 'until [ "$(getprop init.svc.bootanim)" = "stopped" ] || [ -z "$(getprop init.svc.bootanim)" ]; do sleep 1; done' || true

            # Evidencia
            {
              echo "BOOT_OK=1"
              echo "SERIAL=$(adb get-serialno | tr -d '\r')"
              echo "MODEL=$(adb shell getprop ro.product.model | tr -d '\r')"
              echo "ANDROID=$(adb shell getprop ro.build.version.release | tr -d '\r')"
              echo "SDK=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              echo "ABI=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
              echo "ABILIST=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
              echo "ADB_PORT=$ADB_SERVER_PORT"
            } | tee "$GITHUB_WORKSPACE/emulator-boot.log"

            adb devices -l | tee "$GITHUB_WORKSPACE/adb_devices.txt" || true
            adb logcat -d -t 200 > "$GITHUB_WORKSPACE/logcat_tail.txt" || true

      - name: Validate boot
        run: |
          set -eu
          test -s adb_version.txt || (echo "Falta adb_version.txt" && exit 1)
          test -s emulator-boot.log || (echo "Falta emulator-boot.log" && exit 1)
          grep -q "BOOT_OK=1" emulator-boot.log || (echo "No hubo boot completo" && exit 1)
          echo "OK: emulador booteado con ADB en puerto alternativo."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs
          path: |
            adb_version.txt
            adb_devices.txt
            emulator-boot.log
            logcat_tail.txt
