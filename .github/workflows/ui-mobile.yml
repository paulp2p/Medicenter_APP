name: Android UI Tests (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  e2e-android-win:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ANDROID_SDK_ROOT: C:\Android\Sdk
      APPIUM_LOG_LEVEL: info
      # Ruta al APK para capability 'app' (Windows \):
      APP: ${{ github.workspace }}\CI\medicenter_app.apk
      APP_PACKAGE: com.siltium.medicenter
      APP_ACTIVITY: com.siltium.medicenter.MainActivity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt
            **/pyproject.toml

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-behave

      - name: Install Appium v3 + UIAutomator2
        shell: bash
        run: |
          npm i -g appium@3 || npm i -g appium@latest
          appium driver install uiautomator2
          appium -v

      - name: Install Android SDK & system image (API 30)
        shell: powershell
        run: |
          choco install -y androidsdk
          & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat" --licenses < NUL
          & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat" "platform-tools" "emulator" "platforms;android-30" "system-images;android-30;google_apis;x86_64"
          & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\avdmanager.bat" create avd -n test -k "system-images;android-30;google_apis;x86_64" --device "pixel_5" --force

      - name: Download APK from Google Drive (Service Account)
        shell: powershell
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }}  # ej: CI/medicenter_app.apk
        run: |
          choco install -y rclone
          New-Item -ItemType Directory -Force -Path CI | Out-Null
          rclone copy "gdrive:${env:GDRIVE_FILE_PATH}" CI/
          dir CI
          if (!(Test-Path "${{ env.APP }}")) { throw "APK no encontrado en ${{ env.APP }}" }

      - name: Install Android SDK & system image (API 30)
        shell: powershell
        run: |
          choco install -y androidsdk

          # Asegurar ANDROID_SDK_ROOT (depende del paquete de choco)
          if (-not $env:ANDROID_SDK_ROOT) {
            if (Test-Path "C:\Android\Sdk") { $env:ANDROID_SDK_ROOT = "C:\Android\Sdk" }
            elseif (Test-Path "C:\Android\android-sdk") { $env:ANDROID_SDK_ROOT = "C:\Android\android-sdk" }
            else { throw "ANDROID_SDK_ROOT no encontrado" }
          }

          # Detectar la carpeta real de cmdline-tools (latest u otra versión)
          $cliDir = Get-ChildItem -Path "$env:ANDROID_SDK_ROOT\cmdline-tools" -Directory -ErrorAction SilentlyContinue |
                    Sort-Object Name -Descending | Select-Object -First 1
          if (-not $cliDir) { throw "cmdline-tools no encontrado en $env:ANDROID_SDK_ROOT\cmdline-tools" }

          $sdkmanager = Join-Path $cliDir.FullName "bin\sdkmanager.bat"
          $avdmanager = Join-Path $cliDir.FullName "bin\avdmanager.bat"

          # Aceptar licencias (NO usar '< NUL' en PowerShell)
          echo y | & "$sdkmanager" --licenses

          # Actualizar e instalar componentes
          echo y | & "$sdkmanager" --update
          echo y | & "$sdkmanager" `
            "platform-tools" `
            "emulator" `
            "platforms;android-30" `
            "system-images;android-30;google_apis;x86_64"

          # Crear AVD
          & "$avdmanager" create avd -n test -k "system-images;android-30;google_apis;x86_64" --device "pixel_5" --force

      - name: Fail job if tests failed
        shell: bash
        run: |
          CODE=$(cat .behave_exit_code 2>/dev/null || echo 0)
          echo "behave exit code: $CODE"
          exit $CODE

      - name: Upload artifacts (Allure, logs, screenshots, Appium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          retention-days: 7
          path: |
            allure-results/**
            **/screenshots/**
            appium.log
            logcat.txt
          if-no-files-found: warn
