name: Android E2E (Behave + Appium)

on:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    # "Sin timeout": GitHub impone 72h como tope; lo seteamos al máximo.
    timeout-minutes: 4320

    env:
      APPIUM_LOG_LEVEL: info
      APK_PATH: CI/medicenter_app.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Asegura el formateador de Allure para Behave
          pip install allure-behave

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm i -g appium@2
          appium --version
          appium driver install uiautomator2
          appium driver list --installed

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone remote (Service Account)
        # Secrets requeridos: GDRIVE_SA_JSON (contenido del .json)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          mkdir -p /tmp
          echo "$GDRIVE_SA_JSON" > /tmp/sa.json
          # Crea un remote llamado "gdrive" usando el Service Account
          rclone config create gdrive drive service_account_file=/tmp/sa.json scope=drive --non-interactive
          rclone config show | sed 's/client_id = .*/client_id = ***redacted***/g' || true

      - name: Download APK from Google Drive
        # Secret requerido: GDRIVE_APK_REMOTE_PATH (p.ej. CI/medicenter_app.apk)
        env:
          GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }}
        run: |
          mkdir -p CI
          rclone copy "gdrive:${GDRIVE_FILE_PATH}" CI --progress
          echo "Contenido de CI:"
          ls -la CI

      - name: Start Appium (background) and wait port
        run: |
          nohup appium --log-level "${APPIUM_LOG_LEVEL}" > appium.log 2>&1 &
          # Espera hasta 90s a que Appium levante el 4723
          for i in $(seq 1 90); do
            if lsof -i :4723 >/dev/null 2>&1; then
              echo "Appium está arriba en el puerto 4723"
              exit 0
            fi
            sleep 1
          done
          echo "Appium no inició a tiempo"
          exit 1

      - name: Run emulator + tests (Behave -> Allure)
        id: run-tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set +e
            adb devices
            # Instalación previa del APK (si tus tests no lo instalan via capability "app")
            if [ -f "$APK_PATH" ]; then
              adb install -r "$APK_PATH" || echo "Aviso: la instalación podría manejarla Appium/capabilities"
            fi

            # Limpia logcat y ejecuta Behave con Allure
            adb logcat -c || true
            mkdir -p allure-results

            behave -f allure_behave.formatter:AllureFormatter -o allure-results -f progress2
            BEHAVE_EXIT_CODE=$?

            # Dump de logcat para artefacto
            adb logcat -d > logcat.txt || true
            echo "$BEHAVE_EXIT_CODE" > behave_exit_code.txt

            # No fallamos aquí para poder subir artefactos en pasos posteriores
            exit 0

      - name: Zip Allure results
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            zip -r allure-results.zip allure-results
          else
            echo "No se encontró allure-results"
          fi

      - name: Upload Allure results (.zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-zip
          path: allure-results.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload raw Allure folder (opcional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-folder
          path: allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Appium (best-effort)
        if: always()
        run: |
          pkill -f appium || true

      - name: Fail job if tests failed
        if: always()
        run: |
          code=$(cat behave_exit_code.txt 2>/dev/null || echo 0)
          echo "Behave exit code: $code"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
