name: APK download + install smoke

on:
  workflow_dispatch:

jobs:
  # --- JOB 1: descarga desde Drive y publica la APK como artifact ---
  download-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      # Debug opcional del root de Drive
      - name: Debug Drive root (lsf)
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }}
        run: |
          set -euo pipefail
          echo "Listando raíz (gdrive:)"
          rclone lsf "gdrive:" --dirs-only || true
          echo "------"
          SUBDIR="$(dirname "${GDRIVE_FILE_PATH}")"
          if [ "$SUBDIR" != "." ]; then
            echo "Listando subcarpeta gdrive:$SUBDIR"
            rclone lsf "gdrive:$SUBDIR" || true
          fi

      # Descarga estricta
      - name: Download APK from Drive (rclone + SA, path, strict)
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          SRC="gdrive:${GDRIVE_FILE_PATH}"
          DEST="$RUNNER_TEMP/apk/$(basename "${GDRIVE_FILE_PATH}")"
          echo "Copiando: $SRC -> $DEST"
          rclone copyto "$SRC" "$DEST" -P
          test -f "$DEST"
          echo "APP_PATH=$DEST" >> "$GITHUB_ENV"
          ls -lh "$DEST"
          sha256sum "$DEST" | tee apk.sha256

      - name: Save hash and metadata (robusto)
        if: always()
        run: |
          set -euo pipefail
          : > apk_info.txt
          if [ -n "${APP_PATH:-}" ] && [ -f "${APP_PATH:-}" ]; then
            echo "File: $(basename "${APP_PATH}")" >> apk_info.txt
            echo "Path: ${APP_PATH}" >> apk_info.txt
            echo "Size (bytes): $(stat -c%s "${APP_PATH}")" >> apk_info.txt
            [ -f apk.sha256 ] || sha256sum "${APP_PATH}" | tee apk.sha256
            cat apk.sha256 >> apk_info.txt
          else
            echo "APP_PATH no disponible (descarga fallida o ruta incorrecta)." >> apk_info.txt
            echo "NO_HASH" > apk.sha256
          fi
          cat apk_info.txt

      # >>> NUEVO: publicar la APK para el siguiente job <<<
      - name: Upload APK file
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-apk
          path: ${{ env.APP_PATH }}

      - name: Upload proof (hash + info)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-proof
          path: |
            apk.sha256
            apk_info.txt

  # --- JOB 2: arranca emulador, instala APK, la abre y sube evidencia ---
  install-apk:
    needs: download-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: downloaded-apk
          path: ${{ github.workspace }}/apk

      - name: Verify APK presence
        run: |
          set -euo pipefail
          test -f apk/*.apk || (echo "APK artifact missing" && ls -R && exit 1)
          APK_PATH="$(ls -1 apk/*.apk | head -n1)"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Usando: $APK_PATH"

      # El action a veces falla al apagar el emulador; toleramos y validamos luego.
      - name: Boot emulator, install APK, launch, screenshot
        id: emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: >
            -no-window
            -no-boot-anim
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          disable-animations: false   # evitamos crash interno
          script: |
            set -euxo pipefail
            APK="$APK_PATH"

            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 1; done
            adb shell 'until [ "$(getprop init.svc.bootanim)" = "stopped" ] || [ -z "$(getprop init.svc.bootanim)" ]; do sleep 1; done' || true
            sleep 5

            # Evitar suspensión / lockscreen (sin usar "input")
            adb shell svc power stayon true || true
            adb shell settings put system screen_off_timeout 2147483647 || true
            adb shell wm dismiss-keyguard || true

            # Desactivar animaciones (no crítico si falla)
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true

            # Baseline de paquetes instalados
            adb shell pm list packages -f | sort > "$GITHUB_WORKSPACE/pkgs_before.txt"

            # Instalar APK (guardamos salida)
            adb install -r "$APK" | tee "$GITHUB_WORKSPACE/adb_install_output.txt"

            # Detectar paquete nuevo por diff
            adb shell pm list packages -f | sort > "$GITHUB_WORKSPACE/pkgs_after.txt"
            NEWLINE="$(comm -13 "$GITHUB_WORKSPACE/pkgs_before.txt" "$GITHUB_WORKSPACE/pkgs_after.txt" | head -n1 || true)"
            PKG="$(echo "$NEWLINE" | sed -E 's|.*/([^=]+)=.*|\1|' || true)"
            echo "PKG=$PKG" | tee "$GITHUB_WORKSPACE/new_package.txt"

            # Evidencia adicional
            if [ -n "$PKG" ]; then
              adb shell pm path "$PKG" | tee "$GITHUB_WORKSPACE/${PKG}_path.txt" || true
              adb shell dumpsys package "$PKG" > "$GITHUB_WORKSPACE/dumpsys_${PKG}.txt" || true
              # Intentar abrir la app
              adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 || true
            fi

            # Esperar y tomar captura
            sleep 8
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/app-screenshot.png"

      # Verificación dura: instalación correcta y evidencia presente
      - name: Validate installation evidence
        run: |
          set -euo pipefail
          test -f app-screenshot.png || (echo "Missing screenshot" && exit 1)
          grep -q "Success" adb_install_output.txt || (echo "adb install no devolvió 'Success'" && exit 1)
          echo "OK: screenshot + install Success"
          echo "Paquete detectado (si aplica):"
          cat new_package.txt || true

      - name: Upload installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: install-evidence
          path: |
            app-screenshot.png
            adb_install_output.txt
            pkgs_before.txt
            pkgs_after.txt
            new_package.txt
            *_path.txt
            dumpsys_*.txt
