name: UI Mobile — env + emulator + download + install + tests

on:
  workflow_dispatch:

jobs:
  ui-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1) Código del repo (features/steps/utils/etc.)
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Toolchain del SO (Java, Node, Python)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3) Appium + plugins y dependencias Python de tests
      - name: Install Appium & test deps
        run: |
          set -euxo pipefail
          npm i -g appium @appium/doctor allure-commandline --no-audit --no-fund
          appium -v | tee appium_version.txt
          # Appium 2 requiere instalar el driver explícitamente
          appium driver install uiautomator2
          appium-doctor --android | tee appium_doctor.txt

          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install appium-python-client behave allure-behave requests
          fi

      # 4) rclone (lo usaremos más abajo, DENTRO del step del emulador)
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      # 5) Emulador → boot → (ahora) descargar APK → instalar → Appium → Behave → evidencias
      - name: Boot emulator, then download+install APK, then run tests
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true   # el teardown del emulador a veces devuelve error; validamos nosotros
        env:
          # Secrets de Drive para rclone DENTRO del script
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          disable-animations: false
          emulator-options: >
            -no-window -no-boot-anim
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: |
            set -euxo pipefail
            WORK="$GITHUB_WORKSPACE"

            # --- EMULADOR: BOOT ---
            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 1; done
            adb shell 'until [ "$(getprop init.svc.bootanim)" = "stopped" ] || [ -z "$(getprop init.svc.bootanim)" ]; do sleep 1; done' || true
            # Mantener pantalla / quitar keyguard / desactivar animaciones (sin romper si falla)
            adb shell svc power stayon true || true
            adb shell settings put system screen_off_timeout 2147483647 || true
            adb shell wm dismiss-keyguard || true
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true

            # Screenshot del boot (evidencia)
            adb exec-out screencap -p > "$WORK/01-boot.png" || true

            # --- DESCARGA APK (ahora que el emulador YA está listo, como pediste) ---
            mkdir -p "$RUNNER_TEMP/apk"
            SRC="gdrive:${GDRIVE_FILE_PATH}"
            DEST="$RUNNER_TEMP/apk/$(basename "${GDRIVE_FILE_PATH}")"
            rclone copyto "$SRC" "$DEST" -P
            test -f "$DEST"
            APK="$DEST"
            sha256sum "$APK" | tee "$WORK/apk.sha256"

            # --- INSTALACIÓN APK ---
            adb shell pm list packages -f | sort > "$WORK/pkgs_before.txt"
            adb install -r "$APK" | tee "$WORK/adb_install_output.txt"
            grep -q "Success" "$WORK/adb_install_output.txt" || { echo "Instalación fallida"; exit 1; }

            adb shell pm list packages -f | sort > "$WORK/pkgs_after.txt"
            NEWLINE="$(comm -13 "$WORK/pkgs_before.txt" "$WORK/pkgs_after.txt" | head -n1 || true)"
            PKG="$(echo "$NEWLINE" | sed -E 's|.*/([^=]+)=.*|\1|' || true)"
            echo "PKG=$PKG" | tee "$WORK/new_package.txt"
            [ -n "$PKG" ] && adb shell pm path "$PKG" | tee "$WORK/${PKG}_path.txt" || true

            # Abrir la app (best-effort) y screenshot
            if [ -n "$PKG" ]; then
              adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 || true
            fi
            sleep 6
            adb exec-out screencap -p > "$WORK/02-after-install.png" || true

            # --- APPIUM + TESTS (Behave) ---
            appium --log-level info > "$WORK/appium.log" 2>&1 &
            # Esperar puerto 4723
            for i in $(seq 1 90); do
              (echo > /dev/tcp/127.0.0.1/4723) >/dev/null 2>&1 && break || sleep 1
              [ "$i" -eq 90 ] && echo "Appium no levantó" && exit 1
            done

            mkdir -p "$WORK/allure-results"
            # Ejecuta tus features; ajusta tags/paths si hace falta
            behave -f allure_behave.formatter:AllureFormatter -o "$WORK/allure-results" -f pretty || true

            # Screenshot final
            adb exec-out screencap -p > "$WORK/03-after-tests.png" || true

            # Cerrar Appium
            pkill -f appium || true

      # 6) Allure HTML opcional + artifacts
      - name: Generate Allure HTML report
        if: always()
        run: |
          set -euxo pipefail
          if command -v allure >/dev/null 2>&1 && [ -d "allure-results" ] && [ "$(ls -A allure-results | wc -l)" -gt 0 ]; then
            allure generate allure-results --clean -o allure-report || true
            tar -czf allure-report.tar.gz -C allure-report .
          else
            echo "Allure CLI no disponible o sin resultados; omito HTML."
          fi

      - name: Upload artifacts (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-mobile-evidence
          path: |
            appium_version.txt
            appium_doctor.txt
            apk.sha256
            adb_install_output.txt
            pkgs_before.txt
            pkgs_after.txt
            new_package.txt
            *_path.txt
            appium.log
            01-boot.png
            02-after-install.png
            03-after-tests.png
            allure-results
            allure-report.tar.gz
