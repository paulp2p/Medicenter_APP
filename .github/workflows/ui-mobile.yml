name: Android Behave Tests (Sauce Labs US West)

on:
  workflow_dispatch:
    inputs:
      behave_tags:
        description: 'Etiquetas Behave (opcional)'
        required: false
        default: ''
  push:
    branches: [ main, master ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_LOCAL_NAME: medicenter_app.apk
  # Si usas Drive:
  RCLONE_REMOTE: "gdrive"
  GDRIVE_APK_PATH: "CI/medicenter_app.apk"

  # App bajo prueba
  APP_PACKAGE: "com.siltium.medicenter"
  APP_ACTIVITY: "com.siltium.medicenter.MainActivity"

  # Idioma (tus anclas en inglés)
  LANGUAGE: "en"
  LOCALE: "US"

  # Esperas recomendadas
  APP_WAIT_ACTIVITY: ".*"
  APP_WAIT_DURATION: "180000"
  STRICT_APP_WAIT: "false"

jobs:
  android-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install behave selenium appium-python-client allure-behave jq
          fi
          
      # Configurar rclone
      - name: Instalar utilidades (rclone, jq, curl)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y rclone jq curl

      - name: Configurar rclone (desde secreto base64)
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          set -euo pipefail
          [ -n "${RCLONE_CONF_B64:-}" ] || { echo "Falta secrets.RCLONE_CONF_B64"; exit 1; }
          mkdir -p "${HOME}/.config/rclone"
          CLEAN="$(printf '%s' "$RCLONE_CONF_B64" | tr -d '\r\n\t ' )"
          PAD=$(( (4 - (${#CLEAN} % 4)) % 4 ))
          if [ $PAD -gt 0 ]; then CLEAN="${CLEAN}$(printf '=%.0s' $(seq 1 $PAD))"; fi
          printf '%s' "$CLEAN" | base64 -d > "${HOME}/.config/rclone/rclone.conf"
          echo "== Remotos disponibles ==" && rclone listremotes
          # Verifica que exista el remoto [gdrive]
          rclone config show gdrive: >/dev/null 2>&1 || { echo "No existe remoto [gdrive] en rclone.conf"; exit 1; }

      - name: Descargar APK (Drive)
        run: |
          set -eux
          rclone ls "gdrive:${GDRIVE_APK_PATH}"
          rclone copyto "gdrive:${GDRIVE_APK_PATH}" "${APK_LOCAL_NAME}"
          ls -lh "${APK_LOCAL_NAME}"

      - name: Subir APK a Sauce Storage (US West)
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: |
          set -eux
          RESP=$(curl -s -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
                 -X POST "https://api.us-west-1.saucelabs.com/v1/storage/upload" \
                 -F "payload=@${APK_LOCAL_NAME}" \
                 -F "name=${APK_LOCAL_NAME}" \
                 -F "overwrite=true")
          echo "$RESP" | jq .
          APP_URL=$(echo "$RESP" | jq -r '.item.id // .id // empty')
          [ -n "$APP_URL" ] || APP_URL="storage:filename=${APK_LOCAL_NAME}"
          echo "APP_URL=$APP_URL" >> $GITHUB_ENV


      # Ejecutar Behave contra el hub de Sauce (US West)
      - name: Ejecutar tests (Behave → Sauce)
        env:
          APPIUM_SERVER_URL: https://${{ secrets.SAUCE_USERNAME }}:${{ secrets.SAUCE_ACCESS_KEY }}@ondemand.us-west-1.saucelabs.com/wd/hub
          PLATFORM_NAME: "Android"
          AUTOMATION_NAME: "UiAutomator2"
          DEVICE_NAME: "Android GoogleAPI Emulator"
          PLATFORM_VERSION: "12.0"
          APP: ${{ env.APP_URL }}
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
          APP_ACTIVITY: ${{ env.APP_ACTIVITY }}
          LANGUAGE: ${{ env.LANGUAGE }}
          LOCALE: ${{ env.LOCALE }}
          APP_WAIT_ACTIVITY: ${{ env.APP_WAIT_ACTIVITY }}
          APP_WAIT_DURATION: ${{ env.APP_WAIT_DURATION }}
          SAUCE_BUILD: "Build #${{ github.run_number }}"
          SAUCE_NAME:  "Behave - ${{ github.ref_name }}"
          SAUCE_TAGS:  "CI,Android,Behave"
        run: |
          set -eux
          echo "APPIUM_SERVER_URL=$APPIUM_SERVER_URL"
          echo "APP=$APP"
          mkdir -p reports/allure-results
          behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results
          
      # Subir reportes Allure
      - name: Subir artefactos (Allure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results/**
          retention-days: 7
