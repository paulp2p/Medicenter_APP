name: Android Behave Tests (BrowserStack)

on:
  workflow_dispatch:
    inputs:
      behave_tags:
        description: 'Etiquetas Behave (opcional)'
        required: false
        default: ''
  push:
    branches: [ main, master ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_LOCAL_NAME: medicenter_app.apk

  # Si usas Drive:
  RCLONE_REMOTE: "gdrive"
  GDRIVE_APK_PATH: "CI/medicenter_app.apk"

  # App bajo prueba
  APP_PACKAGE: "com.siltium.medicenter"
  APP_ACTIVITY: "com.siltium.medicenter.MainActivity"

  # Idioma (anclas en inglés)
  LANGUAGE: "en"
  LOCALE: "US"

  # Esperas recomendadas
  APP_WAIT_ACTIVITY: ".*"
  APP_WAIT_DURATION: "180000"
  STRICT_APP_WAIT: "false"

jobs:
  android-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install behave selenium appium-python-client allure-behave jq
          fi

      # ---------- rclone (opcional si bajas desde Drive) ----------
      - name: Instalar utilidades (rclone, jq, curl)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y rclone jq curl

      - name: Configurar rclone (desde secreto base64)
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          set -euo pipefail
          [ -n "${RCLONE_CONF_B64:-}" ] || { echo "Falta secrets.RCLONE_CONF_B64"; exit 1; }
          mkdir -p "${HOME}/.config/rclone"
          CLEAN="$(printf '%s' "$RCLONE_CONF_B64" | tr -d '\r\n\t ' )"
          PAD=$(( (4 - (${#CLEAN} % 4)) % 4 ))
          if [ $PAD -gt 0 ]; then CLEAN="${CLEAN}$(printf '=%.0s' $(seq 1 $PAD))"; fi
          printf '%s' "$CLEAN" | base64 -d > "${HOME}/.config/rclone/rclone.conf"
          echo "== Remotos disponibles ==" && rclone listremotes
          rclone config show gdrive: >/dev/null 2>&1 || { echo "No existe remoto [gdrive] en rclone.conf"; exit 1; }

      - name: Descargar APK (Drive)
        run: |
          set -eux
          rclone ls "gdrive:${GDRIVE_APK_PATH}"
          rclone copyto "gdrive:${GDRIVE_APK_PATH}" "${APK_LOCAL_NAME}"
          ls -lh "${APK_LOCAL_NAME}"

      # ---------- Upload a BrowserStack ----------
      - name: Subir APK a BrowserStack (App Automate)
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -eux
          test -f "${APK_LOCAL_NAME}"

          RESP=$(curl -s -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
                -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
                -F "file=@${APK_LOCAL_NAME}")

          echo "$RESP"

          # Extraer bs://... de forma robusta
          APP_URL=$(printf '%s' "$RESP" | jq -r '.app_url // empty')
          [ -n "$APP_URL" ] || { echo "No se pudo obtener app_url de BrowserStack"; exit 1; }

          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"

      # ---------- Ejecutar tests en BrowserStack ----------
      - name: Ejecutar tests (Behave → BrowserStack)
        env:
          # Hub BrowserStack (no levantes Appium local)
          APPIUM_SERVER_URL: https://${{ secrets.BROWSERSTACK_USERNAME }}:${{ secrets.BROWSERSTACK_ACCESS_KEY }}@hub-cloud.browserstack.com/wd/hub

          # Caps base
          PLATFORM_NAME: "Android"
          AUTOMATION_NAME: "UiAutomator2"
          DEVICE_NAME: "Google Pixel 6"
          PLATFORM_VERSION: "12.0"

          # App desde el upload a BS (bs://...)
          APP: ${{ env.APP_URL }}

          # Tu app (pkg/activity) y waits coherentes en cloud
          APP_PACKAGE: "com.siltium.medicenter"
          APP_ACTIVITY: "com.siltium.medicenter.MainActivity"
          APP_WAIT_ACTIVITY: "com.siltium.medicenter.*"
          APP_WAIT_DURATION: "120000"
          STRICT_APP_WAIT: "true"

          # Forzar instalación/estado limpio en cloud
          NO_RESET: "false"
          ENFORCE_APP_INSTALL: "true"

          # Idioma/locale (anclas en inglés)
          LANGUAGE: "en"
          LOCALE: "US"

          # Metadata para dashboard BrowserStack
          BSTACK_PROJECT: "Medicenter"
          BSTACK_BUILD:   "CI #${{ github.run_number }}"
          BSTACK_SESSION: "Behave - ${{ github.ref_name }}"
        run: |
          set -eux
          echo "APPIUM_SERVER_URL=$APPIUM_SERVER_URL"
          echo "APP=$APP"
          echo "DEVICE=$DEVICE_NAME  PLATFORM=$PLATFORM_NAME $PLATFORM_VERSION"
          echo "PKG/ACT=$APP_PACKAGE / $APP_ACTIVITY"
          mkdir -p reports/allure-results
          if [ -n "${{ github.event.inputs.behave_tags }}" ]; then
            behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results -t "${{ github.event.inputs.behave_tags }}"
          else
            behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results
          fi

      # ---------- Allure ----------
      - name: Subir artefactos (Allure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results/**
          retention-days: 7
