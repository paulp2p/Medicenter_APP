name: Android Behave Tests (APK from Google Drive)

on:
  workflow_dispatch:
    inputs:
      behave_tags:
        description: 'Etiquetas Behave (ej: @smoke o @regression) — opcional'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
  API_LEVEL: 30
  AVD_NAME: ci-pixel5-api30
  DEVICE_PROFILE: pixel_5
  APK_LOCAL_NAME: medicenter_app.apk
  PY_VERSION: "3.11"

  # Appium (puente entre framework y emulador)
  USE_APPIUM: "true"
  APPIUM_HOST: "127.0.0.1"
  APPIUM_PORT: "4723"

  # === Google Drive / rclone (ya verificados en tu PC) ===
  RCLONE_REMOTE: "gdrive"
  GDRIVE_APK_PATH: "CI/medicenter_app.apk"   # ya existe según tu rclone ls

jobs:
  android-behave:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 22 (para Appium)
        if: env.USE_APPIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias Python del proyecto
        run: |
          set -eux
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install behave selenium appium-python-client allure-behave
          fi

      # ---------- RCLONE: instalar, restaurar config desde secreto y smoke test ----------
      - name: Instalar rclone y netcat
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y rclone netcat-openbsd

      - name: Configurar rclone (desde secreto base64)
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          set -eux
          if [ -z "${RCLONE_CONF_B64:-}" ]; then
            echo "Falta secrets.RCLONE_CONF_B64 (rclone.conf en base64)."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          rclone version
          rclone listremotes

      - name: "Smoke test: acceso a Drive y descarga de APK"
        run: |
          set -eux
          rclone ls "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}"
          rclone copyto "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}" "${APK_LOCAL_NAME}"
          ls -lh "${APK_LOCAL_NAME}"


      # ---------- ANDROID SDK + EMULADOR ----------
      - name: Instalar Android SDK (cmdline-tools) y componentes
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools
          unzip -q cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm -f cmdline-tools.zip
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"

          yes | sdkmanager --licenses
          yes | sdkmanager \
            "platform-tools" "emulator" "platforms;android-${API_LEVEL}" \
            "system-images;android-${API_LEVEL};google_apis;x86_64"

          adb version
          emulator -version

      - name: Crear AVD
        run: |
          set -eux
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes "no" | avdmanager create avd \
            -n "$AVD_NAME" -k "system-images;android-${API_LEVEL};google_apis;x86_64" \
            -d "$DEVICE_PROFILE" --force
          echo "hw.cpu.ncore=2" >> "$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"
          echo "disk.dataPartition.size=2048M" >> "$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"

      - name: Iniciar emulador (headless, sin KVM) y esperar boot
        run: |
          set -eux
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          nohup emulator -avd "$AVD_NAME" \
            -no-snapshot -no-window -gpu swiftshader_indirect \
            -noaudio -accel off -camera-back none -camera-front none \
            -no-boot-anim -netdelay none -netspeed full > emulator.log 2>&1 &

          adb wait-for-device

          # Esperar hasta 10 minutos a que termine de bootear
          for i in $(seq 1 120); do
            boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$boot_completed" = "1" ]; then
              break
            fi
            sleep 5
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || { echo "El emulador no booteó a tiempo"; exit 1; }

          # Desactivar animaciones para estabilidad
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Instalar APK en el emulador
        run: |
          set -eux
          adb devices
          adb install -r "${APK_LOCAL_NAME}" | tee adb-install.log

      - name: (Opcional) Instalar y arrancar Appium Server
        if: env.USE_APPIUM == 'true'
        run: |
          set -eux
          npm i -g appium
          appium driver install uiautomator2
          nohup appium --base-path /wd/hub --address $APPIUM_HOST --port $APPIUM_PORT > appium.log 2>&1 &
          # esperar a que levante el puerto
          for i in $(seq 1 60); do
            nc -z $APPIUM_HOST $APPIUM_PORT && exit 0 || true
            sleep 1
          done
          echo "Appium no inició a tiempo" && exit 1

      - name: Logcat continuo (background)
        run: |
          set -eux
          nohup adb logcat -v time > logcat.txt 2>&1 &

      - name: Ejecutar tests (Behave)
        env:
          DEVICE_NAME: "emulator-5554"
          PLATFORM_NAME: "Android"
          AUTOMATION_NAME: "UiAutomator2"
          APPIUM_SERVER_URL: "http://${{ env.APPIUM_HOST }}:${{ env.APPIUM_PORT }}/wd/hub"
          APP_PACKAGE: "com.siltium.medicenter"
          APP_ACTIVITY: "com.siltium.medicenter.MainActivity"
        run: |
          set -eux
          mkdir -p reports/allure-results
          TAGS_INPUT="${{ github.event.inputs.behave_tags }}"
          if [ -n "$TAGS_INPUT" ]; then
            behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results -t "$TAGS_INPUT"
          else
            behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results
          fi

      - name: Subir artefactos (Allure, logs, Appium/ADB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          path: |
            reports/allure-results/**
            appium.log
            adb-install.log
            emulator.log
            logcat.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Apagar emulador y limpiar
        if: always()
        run: |
          set -eux
          adb emu kill || true
          pkill -f "emulator" || true
          pkill -f "appium" || true
          adb kill-server || true
