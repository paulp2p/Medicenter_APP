name: Android Behave Tests (APK desde Drive, Ubuntu)

on:
  workflow_dispatch:
    inputs:
      behave_tags:
        description: 'Etiquetas Behave (ej: @smoke, @regression) — opcional'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
  API_LEVEL: 30
  AVD_NAME: ci-pixel5-api30
  DEVICE_PROFILE: pixel_5
  APK_LOCAL_NAME: medicenter_app.apk
  PY_VERSION: "3.11"

  # Appium
  USE_APPIUM: "true"
  APPIUM_HOST: "127.0.0.1"
  APPIUM_PORT: "4723"

  # Google Drive / rclone
  RCLONE_REMOTE: "gdrive"
  GDRIVE_APK_PATH: "CI/medicenter_app.apk"

  # App under test
  APP_PACKAGE: "com.siltium.medicenter"
  APP_ACTIVITY: "com.siltium.medicenter.MainActivity"

  # Esperas de UI (las usa environment.py)
  WAIT_UI_SEC: "60"

jobs:
  android-behave:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (Appium)
        if: env.USE_APPIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: "pip"

      - name: Instalar dependencias Python
        shell: bash
        run: |
          set -eux
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install behave selenium appium-python-client allure-behave
          fi

      # ---------- RCLONE ----------
      - name: Instalar rclone y utilidades
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y rclone curl netcat-openbsd unzip

      - name: Configurar rclone (desde secreto base64)
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RCLONE_CONF_B64:-}" ] || { echo "Falta secrets.RCLONE_CONF_B64"; exit 1; }
          mkdir -p "${HOME}/.config/rclone"
          CLEAN="$(printf '%s' "$RCLONE_CONF_B64" | tr -d '\r\n\t ' )"
          PAD=$(( (4 - (${#CLEAN} % 4)) % 4 ))
          if [ $PAD -gt 0 ]; then CLEAN="${CLEAN}$(printf '=%.0s' $(seq 1 $PAD))"; fi
          printf '%s' "$CLEAN" | base64 -d > "${HOME}/.config/rclone/rclone.conf"
          rclone version
          rclone listremotes

      - name: "Smoke test: acceso a Drive y descarga de APK"
        shell: bash
        run: |
          set -eux
          rclone ls "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}"
          rclone copyto "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}" "${APK_LOCAL_NAME}"
          ls -lh "${APK_LOCAL_NAME}"

      # ---------- ANDROID SDK + EMULADOR ----------
      - name: Instalar Android SDK (cmdline-tools) y componentes
        shell: bash
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"

          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools
          unzip -q cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm -f cmdline-tools.zip

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"

          # Aceptar licencias e instalar paquetes (fail-safe)
          ( yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null ) || true
          ( yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "emulator" "platforms;android-${API_LEVEL}" \
            "build-tools;30.0.3" \
            "system-images;android-${API_LEVEL};google_apis;x86_64" ) || true

          adb version
          emulator -version

      - name: Crear AVD
        shell: bash
        run: |
          set -eux
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes "no" | avdmanager create avd \
            -n "$AVD_NAME" -k "system-images;android-${API_LEVEL};google_apis;x86_64" \
            -d "$DEVICE_PROFILE" --force
          AVD_CFG="$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"
          {
            echo "hw.cpu.ncore=3"
            echo "hw.ramSize=3072"
            echo "vm.heapSize=512"
            echo "tag.id=google_apis"
            echo "image.sysdir.1=$ANDROID_SDK_ROOT/system-images/android-${API_LEVEL}/google_apis/x86_64"
            echo "disk.dataPartition.size=2048M"
          } >> "$AVD_CFG"

      - name: Iniciar emulador (headless, TCG software) y esperar boot
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          export ANDROID_EMULATOR_USE_SYSTEM_LIBS=1
          export ADB_VENDOR_KEYS=

          : > emulator.log
          nohup emulator -avd "$AVD_NAME" \
            -no-window -no-boot-anim -no-snapshot \
            -accel off -no-metrics \
            -gpu swiftshader_indirect -noaudio -camera-back none -camera-front none \
            > emulator.log 2>&1 &

          adb start-server

          DEV=""
          for i in {1..120}; do
            # Si el emulador se cae, fallar rápido con log
            if ! pgrep -f "emulator.*-avd $AVD_NAME" >/dev/null 2>&1; then
              echo "❌ El emulador se detuvo. Últimas líneas:"
              tail -n +1 emulator.log || true
              exit 1
            fi
            DEV="$(adb devices | awk '/emulator-/{print $1; exit}')"
            [ -n "$DEV" ] && break || true
            sleep 2
          done
          [ -n "$DEV" ] || { echo "No se detectó ningún emulator-* a tiempo"; tail -n +200 emulator.log || true; exit 1; }
          echo "ANDROID_SERIAL=$DEV" >> "$GITHUB_ENV"

          # Esperar boot del framework (hasta 5 min)
          BOOT_OK=0
          for i in {1..300}; do
            adb -s "$DEV" shell getprop sys.boot_completed 2>/dev/null | grep -q "1" && { BOOT_OK=1; break; } || true
            sleep 1
          done
          [ "$BOOT_OK" -eq 1 ] || { echo "El emulador no booteó a tiempo"; tail -n +200 emulator.log || true; exit 1; }

      - name: Desbloquear y desactivar animaciones
        shell: bash
        run: |
          set -eux
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"
          [ -n "$dev" ] || { echo "No hay device emulado"; exit 1; }
          adb -s "$dev" shell input keyevent 224 || true
          adb -s "$dev" shell wm dismiss-keyguard || true
          adb -s "$dev" shell input keyevent 82 || true
          adb -s "$dev" shell input keyevent 3  || true
          adb -s "$dev" shell settings put global window_animation_scale 0 || true
          adb -s "$dev" shell settings put global transition_animation_scale 0 || true
          adb -s "$dev" shell settings put global animator_duration_scale 0 || true
          adb -s "$dev" shell svc power stayon true || true

      - name: Espera corta (no bloqueante) de framework
        shell: bash
        run: |
          set -eux
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"
          for i in $(seq 1 30); do
            pm_ok=0; set_ok=0
            adb -s "$dev" shell 'pm path android >/dev/null 2>&1' && pm_ok=1 || pm_ok=0
            adb -s "$dev" shell 'settings list system >/dev/null 2>&1' && set_ok=1 || set_ok=0
            [ $pm_ok -eq 1 ] && [ $set_ok -eq 1 ] && break || true
            sleep 2
          done
          true

      - name: "Watchdog: cerrar ANR de System UI si aparece"
        shell: bash
        run: |
          set -eux
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"
          nohup bash -c '
            while true; do
              if adb -s '"$dev"' shell "dumpsys activity processes | grep -F \"ANR in com.android.systemui\"" >/dev/null 2>&1; then
                adb -s '"$dev"' shell "am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS" || true
                for i in 1 2 3; do adb -s '"$dev"' shell input keyevent 22; adb -s '"$dev"' shell input keyevent 66; sleep 1; done
              fi
              sleep 2
            done
          ' > watchdog.log 2>&1 &

      - name: Instalar y arrancar Appium
        if: env.USE_APPIUM == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          NPM_BIN="$(npm root -g)/.bin"
          if [ -d "$NPM_BIN" ]; then
            echo "$NPM_BIN" >> "$GITHUB_PATH"
            export PATH="$NPM_BIN:$PATH"
          fi
          node -v; npm -v

          npm i -g appium@3 appium-uiautomator2-driver@latest
          which appium || true
          appium --version
          appium driver install uiautomator2 || true

          # Liberar puerto 4723 si quedó algo
          command -v fuser >/dev/null 2>&1 && fuser -k 4723/tcp || true
          command -v lsof  >/dev/null 2>&1 && lsof -ti tcp:4723 | xargs -r kill -9 || true

          : > appium.log
          nohup appium \
            --relaxed-security \
            --allow-insecure=adb_shell \
            --address "$APPIUM_HOST" --port "$APPIUM_PORT" > appium.log 2>&1 &

          for i in $(seq 1 120); do
            if curl -fsS "http://$APPIUM_HOST:$APPIUM_PORT/status" >/dev/null; then
              echo "Appium OK en $APPIUM_HOST:$APPIUM_PORT"; break
            fi
            if ! pgrep -f "appium .*--port $APPIUM_PORT" >/dev/null; then
              echo "Appium se detuvo inesperadamente. Últimas líneas:"
              sed -n '1,400p' appium.log || true
              exit 1
            fi
            sleep 1
          done

          curl -fsS "http://$APPIUM_HOST:$APPIUM_PORT/status" | head -c 500 \
            || { echo "Appium no responde en /status"; sed -n '1,400p' appium.log || true; exit 1; }

      - name: Instalar APK y warm-up de la app
        shell: bash
        run: |
          set -euxo pipefail
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"
          [ -n "$dev" ] || { echo "No hay device emulado"; exit 1; }

          adb devices

          # Esperar a que 'package' responda (evita install a medio boot)
          for i in {1..60}; do
            adb -s "$dev" shell "cmd package list packages >/dev/null" && break || true
            sleep 2
          done

          # Desinstalar previa (si aplica) e instalar
          if [ -n "${APP_PACKAGE:-}" ]; then
            adb -s "$dev" uninstall "${APP_PACKAGE}" || true
          fi
          adb -s "$dev" install -r "${APK_LOCAL_NAME}" | tee adb-install.log

          # Quitar Setup Wizard para que no tape la UI
          adb -s "$dev" shell pm disable-user --user 0 com.google.android.setupwizard || true

          # Descubrir activity launcher real si difiere
          if [ -n "${APP_PACKAGE:-}" ]; then
            ACT_OUT="$(adb -s "$dev" shell cmd package resolve-activity -c android.intent.category.LAUNCHER "${APP_PACKAGE}" 2>/dev/null || true)"
            ACT_NAME="$(printf '%s\n' "$ACT_OUT" | awk -F'name=' '/name=/{print $2}' | sed 's/}//g' | head -n1 || true)"
            if [ -n "$ACT_NAME" ]; then
              echo "APP_ACTIVITY=$ACT_NAME" >> "$GITHUB_ENV"
            fi
          fi

          # Lanzar explícitamente la app y cerrar diálogos del sistema
          if [ -n "${APP_PACKAGE:-}" ] && [ -n "${APP_ACTIVITY:-}" ]; then
            adb -s "$dev" shell am start -W -n "${APP_PACKAGE}/${APP_ACTIVITY}" || true
          else
            [ -n "${APP_PACKAGE:-}" ] && adb -s "$dev" shell monkey -p "${APP_PACKAGE}" -c android.intent.category.LAUNCHER 1 || true
          fi
          adb -s "$dev" shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
          sleep 5

      - name: Ejecutar tests (Behave)
        if: env.USE_APPIUM == 'true'
        timeout-minutes: 55
        env:
          PLATFORM_NAME: "Android"
          AUTOMATION_NAME: "UiAutomator2"
          APPIUM_SERVER_URL: "http://${{ env.APPIUM_HOST }}:${{ env.APPIUM_PORT }}"
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
          APP_ACTIVITY: ${{ env.APP_ACTIVITY }}
          WAIT_UI_SEC: ${{ env.WAIT_UI_SEC }}
        shell: bash
        run: |
          set -eux
          export UDID="${ANDROID_SERIAL}"
          export APP="${APK_LOCAL_NAME}"
          export ANDROID_INSTALL_TIMEOUT=600000
          export NO_RESET=true
          export ENFORCE_APP_INSTALL=false
          export ADB_EXEC_TIMEOUT=300000
          export UIA2_INSTALL_TIMEOUT=300000
          export UIA2_LAUNCH_TIMEOUT=300000

          mkdir -p reports/allure-results
          if [ -n "${{ github.event.inputs.behave_tags }}" ]; then
            timeout 50m behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results -t "${{ github.event.inputs.behave_tags }}"
          else
            timeout 50m behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results
          fi

      - name: Capturar logcat para diagnóstico (no bloqueante)
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"
          : > logcat.txt
          if [ -z "${dev:-}" ]; then
            echo "[logcat] No hay device; omito captura" | tee -a logcat.txt
            exit 0
          fi
          timeout 60s adb -s "$dev" logcat -d -b all -v threadtime -T 10m >> logcat.txt || {
            echo "[logcat] timeout/err; intento corto -t 2000" | tee -a logcat.txt
            timeout 20s adb -s "$dev" logcat -d -t 2000 -v threadtime >> logcat.txt || true
          }

      - name: Subir artefactos (Allure, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          path: |
            reports/allure-results/**
            appium.log
            adb-install.log
            emulator.log
            logcat.txt
            watchdog.log
          if-no-files-found: warn
          retention-days: 7

      - name: Apagar emulador y limpiar
        if: always()
        shell: bash
        run: |
          set -eux
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"
          if [ -n "$dev" ]; then adb -s "$dev" emu kill || true; fi
          pkill -f "emulator" || true
          pkill -f "appium" || true
          adb kill-server || true
