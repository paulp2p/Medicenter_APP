# Nombre del workflow, visible en la interfaz de GitHub Actions
name: CI/CD - Android App Testing

# Definimos los eventos que dispararán este workflow
on:
  push:
    branches:
      - main # Se ejecuta en cada push a la rama 'main'
  pull_request:
    branches:
      - main # Se ejecuta en cada pull request a la rama 'main'
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la interfaz de GitHub

# Configuración de concurrencia para evitar que jobs de la misma rama se solapen
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Definición del único job en este workflow
jobs:
  run_tests:
    name: Ejecutar Tests de End-to-End
    runs-on: ubuntu-latest # El tipo de runner para ejecutar el job
    timeout-minutes: 120 # Timeout de 120 minutos para el job completo

    # Definición de las variables de entorno para el job
    env:
      APP_PACKAGE: com.siltium.medicenter
      APP_ACTIVITY: com.siltium.medicenter.MainActivity
      APP: medicenter_app.apk # El nombre del archivo APK descargado
      BASE_URL_STAGING: http://api.staging.medicenter.com # Ejemplo de URL de API
      # Variables de rclone
      RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      # La variable GDRIVE_FILE_PATH no se usa directamente aquí,
      # ya que la ruta del archivo está hardcodeada, pero se puede mantener
      # para consistencia si los tests la necesitan.
      GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }}

    steps:
      # Paso 1: Hacer checkout del código del repositorio
      - name: Hacer Checkout del Código
        uses: actions/checkout@v4

      # Paso 2: Configurar Node.js (necesario para Appium)
      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Paso 3: Configurar Python (necesario para behave)
      - name: Configurar Python v3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Paso 4: Configurar caché de pip para acelerar la instalación de dependencias
      - name: Configurar Caché de Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Paso 5: Instalar las dependencias de Python desde requirements.txt
      - name: Instalar Dependencias de Python
        run: pip install -r MEDICENTER_APP/requirements.txt

      # Paso 6: Instalar Appium v3 y el driver UIAutomator2
      - name: Instalar Appium y Drivers
        run: |
          npm install -g appium@next
          appium driver install uiautomator2

      # Paso 7: Instalar rclone y descargar la APK de Google Drive
      - name: Descargar APK de Google Drive
        env:
          # Las credenciales de rclone se pasan como variables de entorno
          # Esto es necesario para configurar rclone en el runner
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          # Instala rclone en el runner
          sudo apt-get update && sudo apt-get install -y rclone
          # Configura rclone usando las credenciales del secreto
          echo -e "[GDRIVE]\ntype = drive\nservice_account_file = /tmp/sa.json\nroot_folder_id = ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}" > rclone.conf
          echo "${{ secrets.GDRIVE_SA_JSON }}" > /tmp/sa.json
          # Descarga el archivo APK
          rclone --config rclone.conf copy "GDRIVE:/CI/medicenter_app.apk" .

      # Paso 8: Ejecutar los tests en un emulador Android
      # Se usa la acción 'android-emulator-runner' para gestionar el emulador
      - name: Ejecutar Tests en Emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34 # Versión de API recomendada
          target: google_apis
          arch: x86_64
          profile: pixel_5
          locale: en-US
          disable-animations: true
          emulator-options: -no-snapshot-load -no-window -gpu swiftshader_indirect
          script: |
            # Muestra las variables de entorno de Appium para depuración
            echo "APP_PACKAGE: $APP_PACKAGE"
            echo "APP_ACTIVITY: $APP_ACTIVITY"
            echo "APP: $APP"
            # Ejecuta los tests de Behave
            behave -f allure_behave.formatter:AllureFormatter -o allure-results MEDICENTER_APP/
            # Crea el archivo de logs de Appium (si no existe) para que la siguiente acción lo pueda subir
            touch appium.log

      # Paso 9: Subir los resultados de Allure y otros artefactos
      - name: Subir Resultados de Allure y Logs
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Subir Screenshots y Logs
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-screenshots
          path: |
            **/screenshots/**
            appium.log
            logcat.txt
        # 'if' para asegurar que el paso no falle si los archivos no existen
        if: always()

      # Paso 10: Publicar el reporte de Allure en GitHub Pages
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v3

      - name: Subir Artefactos para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-results

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
