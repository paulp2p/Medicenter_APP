name: Android emulator smoke (manual SDK + AVD)

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: emulator-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (for sdkmanager/avdmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 1) Instalar cmdline-tools (rutas ABSOLUTAS)
      - name: Install Android cmdline-tools
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm -f cmdline-tools.zip
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
          # Para steps siguientes (opcional)
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # 2) Paquetes mínimos del SDK
      - name: Install SDK packages
        run: |
          set -eux
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "platforms;android-30" \
            "system-images;android-30;google_apis;x86_64"
          # Para steps siguientes (opcional)
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator"       >> "$GITHUB_PATH"

      # 3) Crear AVD
      - name: Create AVD (Pixel 5 • API 30 • google_apis x86_64)
        run: |
          set -eux
          echo "no" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            create avd -n ci_api30 \
            -k "system-images;android-30;google_apis;x86_64" \
            -d pixel_5 --force
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd || true

      # 4) Boot del emulador + evidencias (todo con rutas ABSOLUTAS)
      - name: Boot emulator and collect logs
        shell: bash
        run: |
          set -eux
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          EMU="$ANDROID_SDK_ROOT/emulator/emulator"

          $ADB kill-server || true
          $ADB start-server
          $ADB devices -l || true

          "$EMU" -avd ci_api30 -port 5556 \
            -no-window -no-boot-anim -no-audio \
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data \
            -accel off -gpu swiftshader_indirect \
            -camera-back none -camera-front none \
            -verbose > emulator_stdout.log 2>&1 &

          EMU_PID=$!
          timeout 900 bash -c 'until '"$ADB"' shell getprop sys.boot_completed | grep -qm1 1; do sleep 2; done'

          $ADB version | tee adb_version.txt
          {
            echo "BOOT_OK=1"
            echo "SERIAL=$($ADB get-serialno)"
            echo "MODEL=$($ADB shell getprop ro.product.model)"
            echo "ANDROID=$($ADB shell getprop ro.build.version.release)"
            echo "SDK=$($ADB shell getprop ro.build.version.sdk)"
            echo "ABI=$($ADB shell getprop ro.product.cpu.abi)"
          } | tee emulator-boot.log
          $ADB devices -l | tee adb_devices_after.txt
          $ADB logcat -d -t 200 > logcat_tail.txt || true

          $ADB -s emulator-5556 emu kill || true
          timeout 30 tail --pid=$EMU_PID -f /dev/null || true

      - name: Validate boot evidence
        run: |
          set -eu
          test -s emulator-boot.log
          grep -q "BOOT_OK=1" emulator-boot.log
          echo "OK: emulador booteado (manual) y ADB operativo."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-manual-logs
          path: |
            adb_version.txt
            adb_devices_after.txt
            emulator-boot.log
            emulator_stdout.log
            logcat_tail.txt
