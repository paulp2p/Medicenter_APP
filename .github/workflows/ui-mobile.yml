name: Android UI Tests (Medicenter)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: medicenter-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # App & APK
      APP_PACKAGE: com.siltium.medicenter
      APP_ACTIVITY: com.siltium.medicenter.MainActivity
      APK_LOCAL_PATH: CI/medicenter_app.apk
      APP: ${{ github.workspace }}/CI/medicenter_app.apk  # usado por tu framework vía capability 'app'

      # Framework toggles (ajusta si hace falta)
      APPIUM_LOG_LEVEL: info
      LOCALE: en-US

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt
            **/pyproject.toml

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-behave


      - name: Install Appium v3 + UIAutomator2
        run: |
          npm i -g appium@3 || npm i -g appium@latest
          appium driver install uiautomator2
          appium -v

      - name: Install rclone
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y rclone

      - name: Download APK from Google Drive (Service Account)
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }} # ej: CI/medicenter_app.apk
        run: |
          mkdir -p CI
          if [ -z "${GDRIVE_FILE_PATH}" ]; then
            echo "GDRIVE_FILE_PATH secret vacío (ej: CI/medicenter_app.apk)"; exit 1
          fi
          rclone copy "gdrive:${GDRIVE_FILE_PATH}" "CI/" --progress
          ls -l CI
          test -f "$APK_LOCAL_PATH" || { echo "APK no encontrado en $APK_LOCAL_PATH"; exit 1; }

      - name: Run emulator & tests
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "0"
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -accel off
          disable-animations: true
          script: |
            set -euxo pipefail
            echo "== PWD =="; pwd; ls -la

            # Estabilizar ADB y esperar boot
            adb kill-server || true
            adb start-server || true
            adb wait-for-device
            for i in $(seq 1 120); do
              state="$(adb get-state 2>/dev/null || true)"
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              if [ "$state" = "device" ] && [ "$boot" = "1" ]; then echo "Device listo"; break; fi
              adb devices || true
              sleep 2
            done

            # Iniciar Appium
            appium --log-level ${APPIUM_LOG_LEVEL:-info} > "$GITHUB_WORKSPACE/appium.log" 2>&1 &
            for i in $(seq 1 120); do
              if lsof -i :4723 >/dev/null 2>&1; then echo "Appium listo"; break; fi
              [ $i -eq 120 ] && echo "Appium no inició a tiempo" && exit 1
              sleep 1
            done

            # Verificar APK y correr Behave en la raíz
            echo "APP env: $APP"
            ls -l "$(dirname "$APP")" || true
            test -f "$APP"

            mkdir -p allure-results
            set +e
            behave -f allure_behave.formatter:AllureFormatter -o allure-results
            EXIT_CODE=$?
            set -e

            echo "${EXIT_CODE}" > "$GITHUB_WORKSPACE/.behave_exit_code"
            adb logcat -d > "$GITHUB_WORKSPACE/logcat.txt" || true
            pkill -f appium || true

      - name: Upload artifacts (Allure, logs, screenshots, Appium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          retention-days: 7
          path: |
            allure-results/**
            **/screenshots/**
            appium.log
            logcat.txt
          if-no-files-found: warn





