name: Android Behave Tests (APK desde Drive, emulador manual)

on:
  workflow_dispatch:
    inputs:
      behave_tags:
        description: 'Etiquetas Behave (ej: @smoke, @regression) — opcional'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
  API_LEVEL: 30
  AVD_NAME: ci-pixel5-api30
  DEVICE_PROFILE: pixel_5
  APK_LOCAL_NAME: medicenter_app.apk
  PY_VERSION: "3.11"

  # Appium
  USE_APPIUM: "true"
  APPIUM_HOST: "127.0.0.1"
  APPIUM_PORT: "4723"

  # Google Drive / rclone
  RCLONE_REMOTE: "gdrive"
  GDRIVE_APK_PATH: "CI/medicenter_app.apk"

  # (Opcional según tu framework)
  APP_PACKAGE: "com.siltium.medicenter"
  APP_ACTIVITY: "com.siltium.medicenter.MainActivity"

jobs:
  android-behave:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (Appium)
        if: env.USE_APPIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          set -eux
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install behave selenium appium-python-client allure-behave
          fi

      # ---------- RCLONE: restaurar config desde secreto y smoke test ----------
      - name: Instalar rclone
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y rclone netcat-openbsd curl

      - name: "Configurar rclone (desde secreto base64 robusto)"
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RCLONE_CONF_B64:-}" ] || { echo "Falta secrets.RCLONE_CONF_B64"; exit 1; }
          mkdir -p ~/.config/rclone
          CLEAN="$(printf '%s' "$RCLONE_CONF_B64" | tr -d '\r\n\t ' )"
          PAD=$(( (4 - (${#CLEAN} % 4)) % 4 ))
          if [ $PAD -gt 0 ]; then CLEAN="${CLEAN}$(printf '=%.0s' $(seq 1 $PAD))"; fi
          printf '%s' "$CLEAN" | base64 -d > ~/.config/rclone/rclone.conf
          rclone version
          rclone listremotes

      - name: "Smoke test: acceso a Drive y descarga de APK"
        run: |
          set -eux
          rclone ls "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}"
          rclone copyto "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}" "${APK_LOCAL_NAME}"
          ls -lh "${APK_LOCAL_NAME}"

      # ---------- Dependencias de sistema del emulador ----------
      - name: Instalar dependencias del emulador (libs)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            libpulse0 libasound2t64 libnss3 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 \
            libxkbcommon0 libxdamage1 libxfixes3 libxrender1 \
            libgl1 libgles2 libvulkan1 mesa-vulkan-drivers libdrm2 libxshmfence1 libgbm1 \
            libfontconfig1 ca-certificates

      # ---------- ANDROID SDK + EMULADOR ----------
      - name: Instalar Android SDK (cmdline-tools) y componentes
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools
          unzip -q cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm -f cmdline-tools.zip

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"

          yes | sdkmanager --licenses
          yes | sdkmanager \
            "platform-tools" "emulator" "platforms;android-${API_LEVEL}" \
            "build-tools;30.0.3" \
            "system-images;android-${API_LEVEL};google_apis;x86_64"

          # Symlink a la ruta esperada por algunas herramientas
          sudo mkdir -p /usr/local/lib/android
          if [ ! -e /usr/local/lib/android/sdk ]; then
            sudo ln -s "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk
          fi

          ls -la "$ANDROID_SDK_ROOT/system-images/android-${API_LEVEL}/google_apis/x86_64" || exit 1

          adb version
          emulator -version

      - name: Crear AVD
        run: |
          set -eux
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes "no" | avdmanager create avd \
            -n "$AVD_NAME" -k "system-images;android-${API_LEVEL};google_apis;x86_64" \
            -d "$DEVICE_PROFILE" --force
          AVD_CFG="$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"
          {
            echo "hw.cpu.ncore=2"
            echo "disk.dataPartition.size=2048M"
            echo "abi.type=x86_64"
            echo "tag.id=google_apis"
            echo "image.sysdir.1=$ANDROID_SDK_ROOT/system-images/android-${API_LEVEL}/google_apis/x86_64"
          } >> "$AVD_CFG"
          grep -E '(^image.sysdir.1|^abi.type|^tag.id)' "$AVD_CFG" || true

      - name: Iniciar emulador (headless) y estabilizar ADB
        run: |
          set -eux
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          export ANDROID_EMULATOR_USE_SYSTEM_LIBS=1
          export ADB_VENDOR_KEYS=
          pkill -f "adb" || true
          adb kill-server || true
          adb start-server

          # Lanzar emulador sin KVM ni snapshot, puerto fijo 5554
          nohup emulator -avd "$AVD_NAME" \
            -no-window -no-boot-anim -no-snapshot -accel off \
            -gpu swiftshader_indirect -noaudio -camera-back none -camera-front none \
            -no-metrics -port 5554 -ports 5554,5555 > emulator.log 2>&1 &

          # Esperar a que ADB vea el dispositivo
          timeout 180s bash -c 'until adb -s emulator-5554 get-state 2>/dev/null; do sleep 2; done'

          # Esperar boot completo por propiedades del sistema
          for i in $(seq 1 120); do
            b1="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            b2="$(adb -s emulator-5554 shell getprop dev.bootcomplete 2>/dev/null | tr -d '\r')"
            [ "$b1" = "1" ] && [ "$b2" = "1" ] && break || true
            sleep 5
          done
          [ "$b1" = "1" ] && [ "$b2" = "1" ] || { echo "El emulador no booteó a tiempo"; tail -n +200 emulator.log; exit 1; }

      - name: Desbloquear y esperar servicios Android (package/settings)
        run: |
          set -eux
          dev="emulator-5554"

          # Asegurar pantalla encendida y desbloquear
          adb -s $dev shell input keyevent 224 || true   # Wake
          adb -s $dev shell wm dismiss-keyguard || true
          adb -s $dev shell input keyevent 82 || true    # Unlock keyguard
          adb -s $dev shell input keyevent 3  || true    # HOME

          # Esperar a que PackageManager responda
          for i in $(seq 1 60); do
            adb -s $dev shell 'pm path android' >/dev/null 2>&1 && break || true
            sleep 2
          done
          adb -s $dev shell 'pm path android' >/dev/null

          # Esperar a que Settings responda
          for i in $(seq 1 60); do
            adb -s $dev shell 'settings list system' >/dev/null 2>&1 && break || true
            sleep 2
          done

          # Ahora sí, desactivar animaciones (ya hay servicio settings)
          adb -s $dev shell settings put global window_animation_scale 0 || true
          adb -s $dev shell settings put global transition_animation_scale 0 || true
          adb -s $dev shell settings put global animator_duration_scale 0 || true

          echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"

      - name: Instalar APK en el emulador
        run: |
          set -eux
          adb devices
          if [ -n "${APP_PACKAGE:-}" ]; then
            adb -s emulator-5554 uninstall "${APP_PACKAGE}" || true
          fi
          adb -s emulator-5554 install -r "${APK_LOCAL_NAME}" | tee adb-install.log

      - name: (Opcional) Instalar y arrancar Appium
        if: env.USE_APPIUM == 'true'
        run: |
          set -eux
          npm i -g appium
          appium driver install uiautomator2
          nohup appium --address $APPIUM_HOST --port $APPIUM_PORT > appium.log 2>&1 &

          # Esperar a que levante
          for i in $(seq 1 60); do nc -z $APPIUM_HOST $APPIUM_PORT && break || true; sleep 1; done
          nc -z $APPIUM_HOST $APPIUM_PORT

          # Salud
          curl -sSf "http://$APPIUM_HOST:$APPIUM_PORT/status" | head -c 500 || (echo "Appium no responde en /status" && exit 1)

      - name: Preinstalar y arrancar io.appium.settings
        run: |
          set -eux
          dev="emulator-5554"
          SETTINGS_APK="$HOME/.appium/node_modules/appium-uiautomator2-driver/node_modules/io.appium.settings/apks/settings_apk-debug.apk"
          # Verifica que Appium uiautomator2 está instalado (para tener los APKs)
          test -f "$SETTINGS_APK" || { echo "No se encontró io.appium.settings APK en $SETTINGS_APK"; ls -R "$HOME/.appium" || true; exit 1; }

          # Instala/actualiza la app auxiliar y la arranca
          adb -s "$dev" install -r "$SETTINGS_APK" || true
          adb -s "$dev" shell am start -n io.appium.settings/.Settings -W || true

          # Confirma que PackageManager y Settings responden
          adb -s "$dev" shell 'pm path android' >/dev/null
          adb -s "$dev" shell 'settings list system' >/dev/null

      - name: Ejecutar tests (Behave)
        env:
          DEVICE_NAME: "emulator-5554"
          PLATFORM_NAME: "Android"
          AUTOMATION_NAME: "UiAutomator2"
          # ← SIN /wd/hub
          APPIUM_SERVER_URL: "http://${{ env.APPIUM_HOST }}:${{ env.APPIUM_PORT }}"
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
          APP_ACTIVITY: ${{ env.APP_ACTIVITY }}
        run: |
          set -eux
          # Forzar que el driver use el APK descargado localmente
          export APP="${APK_LOCAL_NAME}"
          mkdir -p reports/allure-results
          if [ -n "${{ github.event.inputs.behave_tags }}" ]; then
            behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results -t "${{ github.event.inputs.behave_tags }}"
          else
            behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results
          fi

      - name: Subir artefactos (Allure, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          path: |
            reports/allure-results/**
            appium.log
            adb-install.log
            emulator.log
          if-no-files-found: warn
          retention-days: 7

      - name: Apagar emulador y limpiar
        if: always()
        run: |
          set -eux
          adb -s emulator-5554 emu kill || true
          pkill -f "emulator" || true
          pkill -f "appium" || true
          adb kill-server || true
