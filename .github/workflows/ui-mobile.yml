name: Android emulator smoke (solo boot)

on:
  workflow_dispatch:

jobs:
  emulator-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK requerido por las herramientas del SDK (adb/emulador)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Boot del emulador y recolección de evidencia básica
      - name: Boot emulator (API 30) and collect logs
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true          # el teardown suele avisar error; validamos después
        with:
          api-level: 30
          target: google_apis_playstore  # imagen estable; no abrimos nada dentro
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          disable-animations: false
          emulator-options: >
            -no-window -no-boot-anim
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: |
            # Cada línea es un /bin/sh independiente → no uses variables entre líneas
            set -eu

            # Generar evidencia desde el arranque del script (aunque el emu aún no esté)
            adb version | tee "$GITHUB_WORKSPACE/adb_version.txt" || true
            echo "SCRIPT_STARTED=1" > "$GITHUB_WORKSPACE/emulator-script.log"

            # Boot del emulador
            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 1; done
            adb shell 'until [ "$(getprop init.svc.bootanim)" = "stopped" ] || [ -z "$(getprop init.svc.bootanim)" ]; do sleep 1; done' || true

            # Log del boot
            {
              echo "BOOT_OK=1"
              echo "SERIAL=$(adb get-serialno | tr -d '\r')"
              echo "MODEL=$(adb shell getprop ro.product.model | tr -d '\r')"
              echo "ANDROID=$(adb shell getprop ro.build.version.release | tr -d '\r')"
              echo "SDK=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              echo "ABI=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
              echo "ABILIST=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
              echo "BOOT_COMPLETED=$(adb shell getprop sys.boot_completed | tr -d '\r')"
              echo "TARGET=google_apis_playstore; API=30; ARCH=x86_64; PROFILE=pixel_5"
            } | tee "$GITHUB_WORKSPACE/emulator-boot.log"

            # Últimas líneas de logcat (como smoke)
            adb logcat -d -t 200 > "$GITHUB_WORKSPACE/logcat_tail.txt" || true

      # Validación: falla el job si el emu no booteó
      - name: Validate boot evidence
        run: |
          set -eu
          if [ ! -s emulator-script.log ]; then
            echo "ERROR: el step del emulador NO llegó a ejecutar el script (falló antes de 'script:')."
            exit 1
          fi
          # adb_version ya no es crítico (lo dejamos como warning si faltara)
          if [ ! -s adb_version.txt ]; then
            echo "WARN: falta adb_version.txt (no es crítico, pero debería existir)."
          fi
          test -s emulator-boot.log || (echo "ERROR: no se generó emulator-boot.log" && exit 1)
          grep -q "BOOT_OK=1" emulator-boot.log || (echo "ERROR: Emulador no booteó correctamente" && exit 1)
          echo "OK: emulador booteado y evidencias presentes."


      # Logs como artifact para descargar
      - name: Upload artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-only-logs
          path: |
            emulator-script.log
            adb_version.txt
            emulator-boot.log
            logcat_tail.txt
