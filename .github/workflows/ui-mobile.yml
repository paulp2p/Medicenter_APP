name: UI Mobile — env + emulator + download + install + tests

on:
  workflow_dispatch:

jobs:
  ui-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1) Código del repo (features/steps/utils/etc.)
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Toolchain del SO (Java, Node, Python)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3) Appium + plugins y dependencias Python de tests
      - name: Install Appium & test deps
        run: |
          set -euxo pipefail
          npm i -g appium @appium/doctor allure-commandline --no-audit --no-fund
          appium -v | tee appium_version.txt
          # Appium 2 requiere instalar el driver explícitamente
          appium driver install uiautomator2
          appium-doctor --android | tee appium_doctor.txt

          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install appium-python-client behave allure-behave requests
          fi

      # 4) rclone (lo usaremos más abajo, DENTRO del step del emulador)
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      # 5) Emulador → boot → (ahora) descargar APK → instalar → Appium → Behave → evidencias
      # --- EMULADOR + flujo completo ---
      - name: Boot emulator, then download+install APK, then run tests
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64              # si sale NO_MATCHING_ABIS, probar arm64-v8a
          profile: pixel_5
          force-avd-creation: true
          disable-animations: false
          emulator-options: >
            -no-window -no-boot-anim
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: |
            # /bin/sh: no usar pipefail; cada línea es un sh nuevo → no persisten variables
            set -eu

            # --- Sanity de secreto de ruta ---
            test -n "${GDRIVE_FILE_PATH:-}" || { echo "ERROR: GDRIVE_FILE_PATH vacío"; exit 1; }

            # --- BOOT + screenshot ---
            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 1; done
            adb shell 'until [ "$(getprop init.svc.bootanim)" = "stopped" ] || [ -z "$(getprop init.svc.bootanim)" ]; do sleep 1; done' || true
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/01-boot.png" || true

            # --- DESCARGA APK ---
            mkdir -p "$RUNNER_TEMP/apk"; APK_PATH="$RUNNER_TEMP/apk/$(basename "${GDRIVE_FILE_PATH}")"; rclone copyto "gdrive:${GDRIVE_FILE_PATH}" "$APK_PATH" -P; test -f "$APK_PATH"; sha256sum "$APK_PATH" | tee "$GITHUB_WORKSPACE/apk.sha256"

            # ABIs detectadas en el APK (si es .apk normal)
            ( command -v unzip >/dev/null 2>&1 && unzip -l "$APK_PATH" | awk '/lib\/[^/]+\//{print $4}' | cut -d/ -f2 | sort -u ) > "$GITHUB_WORKSPACE/apk_abis.txt" || true

            # --- INSTALACIÓN + evidencias ---
            adb shell pm list packages -f | sort > "$GITHUB_WORKSPACE/pkgs_before.txt"
            adb install -r -d -t "$APK_PATH" | tee "$GITHUB_WORKSPACE/adb_install_output.txt" || true
            adb shell pm list packages -f | sort > "$GITHUB_WORKSPACE/pkgs_after.txt"
            comm -13 "$GITHUB_WORKSPACE/pkgs_before.txt" "$GITHUB_WORKSPACE/pkgs_after.txt" | head -n1 | sed -E 's|.*/([^=]+)=.*|\1|' | tee "$GITHUB_WORKSPACE/new_package.txt" || true
            PKG="$(cat "$GITHUB_WORKSPACE/new_package.txt" 2>/dev/null || true)"; [ -n "$PKG" ] && adb shell pm path "$PKG" | tee "$GITHUB_WORKSPACE/${PKG}_path.txt" || true

            # Intento de abrir y screenshot
            PKG="$(cat "$GITHUB_WORKSPACE/new_package.txt" 2>/dev/null || true)"; [ -n "$PKG" ] && adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 || true
            sleep 6
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/02-after-install.png" || true

            # --- Appium + Behave (best-effort para dejar evidencias aunque la instalación falle) ---
            appium --log-level info > "$GITHUB_WORKSPACE/appium.log" 2>&1 &
            i=0; while ! (echo > /dev/tcp/127.0.0.1/4723) 2>/dev/null; do i=$((i+1)); [ $i -ge 60 ] && { echo "Appium no levantó"; break; }; sleep 1; done
            mkdir -p "$GITHUB_WORKSPACE/allure-results"
            behave -f allure_behave.formatter:AllureFormatter -o "$GITHUB_WORKSPACE/allure-results" -f pretty || true
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/03-after-tests.png" || true
            pkill -f appium || true

      - name: Validate evidence (fail if missing, explica motivo)
        run: |
          set -eu
          # Mostrar log de instalación
          echo "===== adb_install_output.txt ====="
          ( test -f adb_install_output.txt && cat adb_install_output.txt ) || echo "(no existe)"
          echo "===== apk_abis.txt (si hay) ====="
          ( test -s apk_abis.txt && cat apk_abis.txt ) || echo "(no detectado)"

          # Fallas específicas y mensaje claro
          if ! grep -q "Success" adb_install_output.txt 2>/dev/null; then
            if grep -qi "NO_MATCHING_ABIS" adb_install_output.txt 2>/dev/null; then
              echo "ERROR: ABI incompatible (APK ABIs vs emulador x86_64)."
              echo "Sugerencias:"
              echo " - Cambiar el emulador a ARM: en el step del emulador usa: arch: arm64-v8a"
              echo " - O compilar un APK universal que incluya x86/x86_64."
            elif grep -qi "VERSION_DOWNGRADE" adb_install_output.txt 2>/dev/null; then
              echo "ERROR: Version downgrade. Usé -d, pero igual falló. Desinstalar primero o subir versionCode."
            elif grep -qi "UPDATE_INCOMPATIBLE" adb_install_output.txt 2>/dev/null; then
              echo "ERROR: Firma/paquete incompatible con lo ya instalado. Probar: adb uninstall <package> antes."
            elif grep -qi "INCOMPATIBLE" adb_install_output.txt 2>/dev/null; then
              echo "ERROR: Incompatibilidad (revisar minSdk/target/abi)."
            elif grep -qi "PARSE" adb_install_output.txt 2>/dev/null; then
              echo "ERROR: APK corrupto o sin firmar (PARSE_FAILED)."
            else
              echo "ERROR: Instalación fallida. Revisa 'adb_install_output.txt'."
            fi
            exit 1
          fi

          # Evidencias mínimas
          test -s apk.sha256 || (echo "Falta apk.sha256" && exit 1)
          test -s 01-boot.png || (echo "Falta 01-boot.png" && exit 1)
          test -s 02-after-install.png || (echo "Falta 02-after-install.png" && exit 1)
          echo "Validación OK: boot, instalación y evidencias presentes"


      # 6) Allure HTML opcional + artifacts
      - name: Generate Allure HTML report
        if: always()
        run: |
          set -euxo pipefail
          if command -v allure >/dev/null 2>&1 && [ -d "allure-results" ] && [ "$(ls -A allure-results | wc -l)" -gt 0 ]; then
            allure generate allure-results --clean -o allure-report || true
            tar -czf allure-report.tar.gz -C allure-report .
          else
            echo "Allure CLI no disponible o sin resultados; omito HTML."
          fi

      - name: Upload artifacts (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-mobile-evidence
          path: |
            appium_version.txt
            appium_doctor.txt
            apk.sha256
            adb_install_output.txt
            pkgs_before.txt
            pkgs_after.txt
            new_package.txt
            *_path.txt
            appium.log
            01-boot.png
            02-after-install.png
            03-after-tests.png
            allure-results
            allure-report.tar.gz
