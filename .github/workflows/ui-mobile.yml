name: Android UI Tests (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  e2e-android-win:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ANDROID_SDK_ROOT: C:\Android\Sdk
      APPIUM_LOG_LEVEL: info
      # Ruta al APK para capability 'app' (Windows \):
      APP: ${{ github.workspace }}\CI\medicenter_app.apk
      APP_PACKAGE: com.siltium.medicenter
      APP_ACTIVITY: com.siltium.medicenter.MainActivity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt
            **/pyproject.toml

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-behave

      - name: Install Appium v3 + UIAutomator2
        shell: bash
        run: |
          npm i -g appium@3 || npm i -g appium@latest
          appium driver install uiautomator2
          appium -v

      - name: Install Android SDK & system image (API 30)
        shell: powershell
        run: |
          choco install -y androidsdk
          & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat" --licenses < NUL
          & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat" "platform-tools" "emulator" "platforms;android-30" "system-images;android-30;google_apis;x86_64"
          & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\avdmanager.bat" create avd -n test -k "system-images;android-30;google_apis;x86_64" --device "pixel_5" --force

      - name: Download APK from Google Drive (Service Account)
        shell: powershell
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }}  # ej: CI/medicenter_app.apk
        run: |
          choco install -y rclone
          New-Item -ItemType Directory -Force -Path CI | Out-Null
          rclone copy "gdrive:${env:GDRIVE_FILE_PATH}" CI/
          dir CI
          if (!(Test-Path "${{ env.APP }}")) { throw "APK no encontrado en ${{ env.APP }}" }

      - name: Start emulator + Appium + run tests
        shell: powershell
        continue-on-error: true
        run: |
          # Arrancar emulador (sin aceleración hw, headless)
          $emu = Start-Process -FilePath "$env:ANDROID_SDK_ROOT\emulator\emulator.exe" `
                 -ArgumentList "-avd test -no-window -no-snapshot -no-boot-anim -no-audio -gpu swiftshader_indirect -accel off" `
                 -PassThru

          & "$env:ANDROID_SDK_ROOT\platform-tools\adb.exe" start-server

          # Esperar boot completo
          $max=240
          for ($i=0; $i -lt $max; $i++) {
            $state = & "$env:ANDROID_SDK_ROOT\platform-tools\adb.exe" get-state 2>$null
            $boot  = & "$env:ANDROID_SDK_ROOT\platform-tools\adb.exe" shell getprop sys.boot_completed 2>$null
            if ($state -match "device" -and $boot -match "1") { break }
            Start-Sleep -Seconds 2
          }

          # Desactivar animaciones
          & "$env:ANDROID_SDK_ROOT\platform-tools\adb.exe" shell settings put global window_animation_scale 0
          & "$env:ANDROID_SDK_ROOT\platform-tools\adb.exe" shell settings put global transition_animation_scale 0
          & "$env:ANDROID_SDK_ROOT\platform-tools\adb.exe" shell settings put global animator_duration_scale 0

          # Iniciar Appium
          $appium = Start-Process -FilePath "appium" -ArgumentList "--log-level $env:APPIUM_LOG_LEVEL" `
                     -NoNewWindow -RedirectStandardOutput "appium.log" -RedirectStandardError "appium.log" -PassThru
          # Esperar puerto 4723
          for ($i=0; $i -lt 120; $i++) {
            if (Test-NetConnection -ComputerName "localhost" -Port 4723 -InformationLevel Quiet) { break }
            Start-Sleep -Seconds 1
          }

          # Ejecutar tests (Allure en ./allure-results)
          New-Item -ItemType Directory -Force -Path allure-results | Out-Null
          $env:PYTHONIOENCODING="utf-8"
          python -m behave -f allure_behave.formatter:AllureFormatter -o allure-results
          $LASTEXITCODE > .behave_exit_code

          # Logcat
          & "$env:ANDROID_SDK_ROOT\platform-tools\adb.exe" logcat -d > logcat.txt

          # Cierre best-effort
          if ($appium -ne $null) { Stop-Process -Id $appium.Id -Force -ErrorAction SilentlyContinue }
          & "$env:ANDROID_SDK_ROOT\platform-tools\adb.exe" emu kill 2>$null

      - name: Fail job if tests failed
        shell: bash
        run: |
          CODE=$(cat .behave_exit_code 2>/dev/null || echo 0)
          echo "behave exit code: $CODE"
          exit $CODE

      - name: Upload artifacts (Allure, logs, screenshots, Appium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          retention-days: 7
          path: |
            allure-results/**
            **/screenshots/**
            appium.log
            logcat.txt
          if-no-files-found: warn
