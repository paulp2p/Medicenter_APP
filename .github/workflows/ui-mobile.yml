name: Android Tests (APK desde Drive, Self-hosted con KVM)

on:
  workflow_dispatch:
    inputs:
      behave_tags:
        description: 'Etiquetas Behave (ej: @smoke, @regression) — opcional'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
  API_LEVEL: 30
  AVD_NAME: ci-pixel5-api30
  DEVICE_PROFILE: pixel_5
  APK_LOCAL_NAME: medicenter_app.apk
  PY_VERSION: "3.11"

  # Appium
  USE_APPIUM: "true"
  APPIUM_HOST: "127.0.0.1"
  APPIUM_PORT: "4723"

  # Google Drive / rclone
  RCLONE_REMOTE: "gdrive"
  GDRIVE_APK_PATH: "CI/medicenter_app.apk"

  # App bajo prueba
  APP_PACKAGE: "com.siltium.medicenter"
  APP_ACTIVITY: "com.siltium.medicenter.MainActivity"

  WAIT_UI_SEC: "45"

jobs:
  android-behave:
    # Requiere que tu runner self-hosted tenga estos labels
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight KVM/Nested Virt
        run: |
          set -euxo pipefail
          # 1) CPU soporta VT-x / AMD-V
          egrep -c '(vmx|svm)' /proc/cpuinfo | grep -q '[1-9]' || { echo "❌ El host no expone VT-x/AMD-V"; exit 1; }
          # 2) /dev/kvm presente
          [ -e /dev/kvm ] || { echo "❌ /dev/kvm no existe en el host"; ls -l /dev | grep kvm || true; exit 1; }
          # 3) Permisos: el usuario del runner debe estar en grupo kvm
          id | grep -q '(kvm)' || { echo "❌ El usuario no está en grupo kvm. Agregalo (sudo gpasswd -a <user> kvm) y reinicia el servicio del runner."; exit 1; }
          # Info
          ls -l /dev/kvm || true
          echo "✅ KVM ok"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (Appium)
        if: env.USE_APPIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          set -eux
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install behave selenium appium-python-client allure-behave
          fi

      # ---------- LIBRERÍAS DEL EMULADOR ----------
      - name: Instalar dependencias del emulador (libs)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            unzip curl netcat-openbsd \
            libpulse0 libasound2 libnss3 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 \
            libxkbcommon0 libxdamage1 libxfixes3 libxrender1 \
            libgl1 libgles2 libvulkan1 mesa-vulkan-drivers libdrm2 libxshmfence1 libgbm1 \
            libfontconfig1 ca-certificates

      # ---------- RCLONE ----------
      - name: Instalar rclone
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configurar rclone (desde secreto base64)
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          set -euo pipefail
          [ -n "${RCLONE_CONF_B64:-}" ] || { echo "Falta secrets.RCLONE_CONF_B64"; exit 1; }
          mkdir -p "${HOME}/.config/rclone"
          CLEAN="$(printf '%s' "$RCLONE_CONF_B64" | tr -d '\r\n\t ' )"
          PAD=$(( (4 - (${#CLEAN} % 4)) % 4 ))
          if [ $PAD -gt 0 ]; then CLEAN="${CLEAN}$(printf '=%.0s' $(seq 1 $PAD))"; fi
          printf '%s' "$CLEAN" | base64 -d > "${HOME}/.config/rclone/rclone.conf"
          rclone version
          rclone listremotes

      - name: "Smoke test: acceso a Drive y descarga de APK"
        run: |
          set -eux
          rclone ls "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}"
          rclone copyto "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}" "${APK_LOCAL_NAME}"
          ls -lh "${APK_LOCAL_NAME}"

      # ---------- ANDROID SDK + EMULADOR ----------
      - name: Instalar Android SDK (cmdline-tools) y componentes
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools
          unzip -q cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm -f cmdline-tools.zip

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"

          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
              "platform-tools" "emulator" "platforms;android-${API_LEVEL}" \
              "build-tools;30.0.3" \
              "system-images;android-${API_LEVEL};google_apis;x86_64" || true

          adb version
          emulator -version

      - name: Crear AVD (google_apis)
        run: |
          set -eux
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes "no" | avdmanager create avd \
            -n "$AVD_NAME" -k "system-images;android-${API_LEVEL};google_apis;x86_64" \
            -d "$DEVICE_PROFILE" --force
          AVD_CFG="$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"
          {
            echo "hw.cpu.ncore=4"
            echo "hw.ramSize=4096"
            echo "vm.heapSize=576"
            echo "tag.id=google_apis"
            echo "image.sysdir.1=$ANDROID_SDK_ROOT/system-images/android-${API_LEVEL}/google_apis/x86_64"
            echo "disk.dataPartition.size=6144M"
          } >> "$AVD_CFG"

      - name: Iniciar emulador (headless, KVM on) y esperar boot
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          export ANDROID_EMULATOR_USE_SYSTEM_LIBS=1
          export ADB_VENDOR_KEYS=
          : > emulator.log

          # Con KVM activado
          nohup emulator -avd "$AVD_NAME" \
            -no-window -no-boot-anim -no-snapshot \
            -accel on -no-metrics \
            -gpu swiftshader_indirect -noaudio -camera-back none -camera-front none \
            > emulator.log 2>&1 &

          adb start-server

          # Detectar dispositivo
          for i in {1..120}; do
            pgrep -f "emulator.*-avd $AVD_NAME" >/dev/null || { echo "❌ Emu muerto"; tail -n +1 emulator.log || true; exit 1; }
            DEV="$(adb devices | awk '/emulator-/{print $1; exit}')"
            [ -n "$DEV" ] && break || true
            sleep 2
          done
          [ -n "${DEV:-}" ] || { echo "No se detectó emulator-*"; tail -n +200 emulator.log || true; exit 1; }
          echo "ANDROID_SERIAL=$DEV" >> "$GITHUB_ENV"

          # Esperar boot
          for i in {1..300}; do
            adb -s "$DEV" shell getprop sys.boot_completed 2>/dev/null | grep -q "1" && break || true
            sleep 1
          done

      - name: Desbloquear y desactivar animaciones
        run: |
          set -eux
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"; [ -n "$dev" ]
          adb -s "$dev" shell input keyevent 224 || true
          adb -s "$dev" shell wm dismiss-keyguard || true
          adb -s "$dev" shell input keyevent 82 || true
          adb -s "$dev" shell input keyevent 3  || true
          adb -s "$dev" shell settings put global window_animation_scale 0 || true
          adb -s "$dev" shell settings put global transition_animation_scale 0 || true
          adb -s "$dev" shell settings put global animator_duration_scale 0 || true
          adb -s "$dev" shell svc power stayon true || true
          # Evitar overlay del sistema que tapa el "anchor"
          adb -s "$dev" shell settings put global heads_up_notifications_enabled 0 || true
          adb -s "$dev" shell cmd statusbar collapse || true

      - name: Instalar y arrancar Appium
        if: env.USE_APPIUM == 'true'
        run: |
          set -euxo pipefail
          NPM_BIN="$(npm root -g)/.bin"
          if [ -d "$NPM_BIN" ]; then echo "$NPM_BIN" >> "$GITHUB_PATH"; export PATH="$NPM_BIN:$PATH"; fi
          node -v; npm -v
          npm i -g appium@3 appium-uiautomator2-driver@latest
          which appium || true
          appium --version
          appium driver install uiautomator2 || true
          command -v fuser >/dev/null 2>&1 && fuser -k 4723/tcp || true
          command -v lsof  >/dev/null 2>&1 && lsof -ti tcp:4723 | xargs -r kill -9 || true
          : > appium.log
          nohup appium --relaxed-security --allow-insecure=adb_shell \
            --address "$APPIUM_HOST" --port "$APPIUM_PORT" > appium.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS "http://$APPIUM_HOST:$APPIUM_PORT/status" >/dev/null && break || true
            pgrep -f "appium .*--port $APPIUM_PORT" >/dev/null || { echo "Appium se detuvo"; sed -n '1,400p' appium.log || true; exit 1; }
            sleep 1
          done
          curl -fsS "http://$APPIUM_HOST:$APPIUM_PORT/status" | head -c 500 || { sed -n '1,400p' appium.log || true; exit 1; }

      - name: Instalar APK en el emulador (robusto + fix PM)
        shell: bash
        run: |
          set -euxo pipefail
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"; [ -n "$dev" ]
          adb -s "$dev" wait-for-device

          # Esperar framework
          deadline=$((SECONDS+600))
          until adb -s "$dev" shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do
            [ $SECONDS -lt $deadline ] || { echo "[boot] timeout esperando sys.boot_completed"; exit 1; }
            sleep 1
          done

          # FIX: esperar a que responda el Package Manager (no el listado de servicios)
          until adb -s "$dev" shell "cmd package list packages >/dev/null 2>&1"; do
            [ $SECONDS -lt $deadline ] || { echo "[pm] timeout esperando 'cmd package'"; exit 1; }
            sleep 1
          done

          # Higiene
          adb -s "$dev" shell settings put global verifier_verify_adb_installs 0 || true
          if [ -n "${APP_PACKAGE:-}" ]; then
            adb -s "$dev" shell "am force-stop ${APP_PACKAGE}" || true
            adb -s "$dev" shell "pm clear ${APP_PACKAGE}" || true
            adb -s "$dev" uninstall "${APP_PACKAGE}" || true
          fi

          # Install normal y fallback por sesión
          if ! adb -s "$dev" install -r -d -t "${APK_LOCAL_NAME}"; then
            echo "Instalación streamed falló; probando instalación por 'session'..."
            adb -s "$dev" push -p "${APK_LOCAL_NAME}" /data/local/tmp/app-under-test.apk
            sess="$(adb -s "$dev" shell 'cmd package install-create -r -d -t' | sed -n 's/.*\[\(.*\)\].*/\1/p' || true)"
            [ -n "$sess" ] || { echo "No se pudo crear sesión de instalación"; exit 1; }
            adb -s "$dev" shell "cmd package install-write ${sess} base /data/local/tmp/app-under-test.apk"
            adb -s "$dev" shell "cmd package install-commit ${sess}"
          fi

          # Colapsar notificaciones antes de tests
          adb -s "$dev" shell cmd statusbar collapse || true

      - name: Ejecutar tests (Behave)
        if: env.USE_APPIUM == 'true'
        timeout-minutes: 55
        env:
          PLATFORM_NAME: "Android"
          AUTOMATION_NAME: "UiAutomator2"
          APPIUM_SERVER_URL: "http://${{ env.APPIUM_HOST }}:${{ env.APPIUM_PORT }}"
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
          APP_ACTIVITY: ${{ env.APP_ACTIVITY }}
          WAIT_UI_SEC: ${{ env.WAIT_UI_SEC }}
        run: |
          set -eux
          export UDID="${ANDROID_SERIAL}"
          export APP="${APK_LOCAL_NAME}"
          export ANDROID_INSTALL_TIMEOUT=600000
          export NO_RESET=true
          export ENFORCE_APP_INSTALL=false
          export ADB_EXEC_TIMEOUT=300000
          export UIA2_INSTALL_TIMEOUT=300000
          export UIA2_LAUNCH_TIMEOUT=300000

          mkdir -p reports/allure-results
          if [ -n "${{ github.event.inputs.behave_tags }}" ]; then
            timeout 50m behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results -t "${{ github.event.inputs.behave_tags }}"
          else
            timeout 50m behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results
          fi

      - name: Capturar logcat para diagnóstico (no bloqueante)
        if: always()
        run: |
          set -euxo pipefail
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"; : > logcat.txt
          if [ -z "${dev:-}" ]; then
            echo "[logcat] No hay device; omito captura" | tee -a logcat.txt
            exit 0
          fi
          timeout 60s adb -s "$dev" logcat -d -b all -v threadtime -T 10m >> logcat.txt || {
            echo "[logcat] timeout/err; intento corto -t 2000" | tee -a logcat.txt
            timeout 20s adb -s "$dev" logcat -d -t 2000 -v threadtime >> logcat.txt || true
          }

      - name: Subir artefactos (Allure, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          path: |
            reports/allure-results/**
            appium.log
            emulator.log
            logcat.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Apagar emulador y limpiar
        if: always()
        run: |
          set -eux
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"; if [ -n "$dev" ]; then adb -s "$dev" emu kill || true; fi
          pkill -f "emulator" || true
          pkill -f "appium" || true
          adb kill-server || true
