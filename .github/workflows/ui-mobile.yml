name: Android Behave Tests (emulator-runner + APK de Drive)

on:
  workflow_dispatch:
    inputs:
      behave_tags:
        description: 'Etiquetas Behave (ej: @smoke o @regression) — opcional'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_LOCAL_NAME: medicenter_app.apk
  PY_VERSION: "3.11"

  # Appium (puente con el emulador)
  USE_APPIUM: "true"
  APPIUM_HOST: "127.0.0.1"
  APPIUM_PORT: "4723"

  # rclone / Google Drive
  RCLONE_REMOTE: "gdrive"
  GDRIVE_APK_PATH: "CI/medicenter_app.apk"

  # (Opcional, completa si tu framework lo usa)
  APP_PACKAGE: "com.siltium.medicenter.MainActivity"
  APP_ACTIVITY: "com.siltium.medicenter"  

jobs:
  android-behave:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (Appium)
        if: env.USE_APPIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          set -eux
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install behave selenium appium-python-client allure-behave
          fi

      # ---------- RCLONE: restaurar config desde secreto y smoke test ----------
      - name: Instalar rclone
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y rclone netcat-openbsd

      - name: "Configurar rclone (desde secreto base64 robusto)"
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          set -eu
          if [ -z "${RCLONE_CONF_B64:-}" ]; then
            echo "Falta secrets.RCLONE_CONF_B64"; exit 1
          fi
          mkdir -p ~/.config/rclone
          python - <<'PY'
import os, base64, pathlib
b = os.environ["RCLONE_CONF_B64"].encode()
# limpiar espacios/saltos y completar padding
b = b"".join(b.split())
b += b"=" * ((4 - (len(b) % 4)) % 4)
out = pathlib.Path.home() / ".config" / "rclone" / "rclone.conf"
out.parent.mkdir(parents=True, exist_ok=True)
out.write_bytes(base64.b64decode(b))
print("rclone.conf OK ->", out)
PY
          rclone version
          rclone listremotes

      - name: "Smoke test: acceso a Drive y descarga de APK"
        run: |
          set -eux
          rclone ls "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}"
          rclone copyto "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}" "${APK_LOCAL_NAME}"
          ls -lh "${APK_LOCAL_NAME}"

      # ---------- Emulador con android-emulator-runner ----------
      - name: Launch emulator + run tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-boot-anim -no-snapshot -accel off -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          script: |
            set -eux
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
            export PATH="$ANDROID_SDK_ROOT/platform-tools:$PATH"

            # ADB confiable
            adb kill-server || true
            adb start-server
            adb devices

            # Esperar boot explícitamente (hasta 10 min)
            timeout=0
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
              sleep 5
              timeout=$((timeout+5))
              if [ $timeout -gt 600 ]; then echo "Timeout esperando boot_completed"; exit 1; fi
            done

            # Instalar APK (desinstalar si ya existe para evitar conflictos de firma)
            if [ -n "${APP_PACKAGE:-}" ]; then
              adb uninstall "${APP_PACKAGE}" || true
            fi
            adb install -r "${APK_LOCAL_NAME}" | tee adb-install.log

            # Appium (opcional)
            if [ "${USE_APPIUM}" = "true" ]; then
              npm i -g appium
              appium driver install uiautomator2
              nohup appium --base-path /wd/hub --address $APPIUM_HOST --port $APPIUM_PORT > appium.log 2>&1 &
              for i in $(seq 1 60); do nc -z $APPIUM_HOST $APPIUM_PORT && break || true; sleep 1; done
            fi

            # Ejecutar Behave (con soporte de tags del dispatch)
            mkdir -p reports/allure-results
            TAGS_INPUT="${{ github.event.inputs.behave_tags }}"
            if [ -n "$TAGS_INPUT" ]; then
              behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results -t "$TAGS_INPUT"
            else
              behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results
            fi

      - name: Subir artefactos (Allure, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          path: |
            reports/allure-results/**
            appium.log
            adb-install.log
          if-no-files-found: warn
          retention-days: 7
