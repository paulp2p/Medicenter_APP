name: Android emulator smoke (macOS • solo boot)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: emulator-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-only:
    runs-on: macos-14          # macOS (Apple Silicon)
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Boot emulator (API 30 • ARM64) and collect logs
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true                 # ignoramos warning de teardown
        with:
          api-level: 30
          target: google_apis                   # más liviano que Play Store
          arch: arm64-v8a                       # << CLAVE en macOS (no x86_64)
          profile: pixel_5
          force-avd-creation: true
          emulator-boot-timeout: 1800000        # hasta 30 min por si descarga imagen
          # Hardware/flags recomendados para macOS (HVF)
          emulator-options: >
            -no-window -no-boot-anim -no-audio
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data
            -gpu host
            -camera-back none -camera-front none
            -accel hvf
            -verbose
          disable-animations: false
          script: |
            set -eu
            # Si llegamos aquí, el emu lanzó y ADB está disponible.
            adb version | tee "$GITHUB_WORKSPACE/adb_version.txt" || true
            echo "SCRIPT_STARTED=1" > "$GITHUB_WORKSPACE/emulator-script.log"

            adb wait-for-device
            until adb shell getprop sys.boot_completed | grep -m 1 '1'; do sleep 1; done
            adb shell 'until [ "$(getprop init.svc.bootanim)" = "stopped" ] || [ -z "$(getprop init.svc.bootanim)" ]; do sleep 1; done' || true

            {
              echo "BOOT_OK=1"
              echo "SERIAL=$(adb get-serialno | tr -d '\r')"
              echo "MODEL=$(adb shell getprop ro.product.model | tr -d '\r')"
              echo "ANDROID=$(adb shell getprop ro.build.version.release | tr -d '\r')"
              echo "SDK=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              echo "ABI=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
              echo "ABILIST=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
              echo "TARGET=google_apis; API=30; ARCH=arm64-v8a; PROFILE=pixel_5"
            } | tee "$GITHUB_WORKSPACE/emulator-boot.log"

            # Peek de logcat como smoke
            adb logcat -d -t 200 > "$GITHUB_WORKSPACE/logcat_tail.txt" || true

      - name: Validate boot evidence
        run: |
          set -eu
          if [ ! -s emulator-script.log ]; then
            echo "ERROR: el action nunca llegó a ejecutar 'script:' (timeout antes del boot)."
            exit 1
          fi
          test -s emulator-boot.log || (echo "ERROR: no se generó emulator-boot.log" && exit 1)
          grep -q "BOOT_OK=1" emulator-boot.log || (echo "ERROR: el emulador no reportó boot completo" && exit 1)
          echo "OK: emulador ARM64 booteado en macOS."

      - name: Upload artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-only-logs
          path: |
            emulator-script.log
            adb_version.txt
            emulator-boot.log
            logcat_tail.txt
