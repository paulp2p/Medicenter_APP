name: Android E2E (Behave + Appium)

on:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    # “Sin timeout”: tope de GitHub 72h (4320 min)
    timeout-minutes: 120
    env:
      APPIUM_LOG_LEVEL: info

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install allure-behave

      - name: Install Appium v3 (RC) + UiAutomator2 driver
        run: |
          npm i -g appium@next
          appium --version
          appium driver install uiautomator2
          appium driver list --installed

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      # === Descarga del APK usando tu configuración por ENV (Service Account + ROOT_FOLDER_ID) ===
      - name: Download APK from Drive (rclone + Service Account)
        env:
          # Remote "GDRIVE" configurado vía variables de entorno (sin rclone config file)
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          # Ruta relativa al ROOT_FOLDER_ID
          GDRIVE_FILE_PATH: ${{ secrets.GDRIVE_FILE_PATH }}
        run: |
          set -eu
          SRC="GDRIVE:${GDRIVE_FILE_PATH}"
          DEST="$RUNNER_TEMP/app.apk"
          echo "Copiando APK: $SRC -> $DEST"
          rclone copyto "$SRC" "$DEST" -P
          test -f "$DEST"
          echo "APK_PATH=$DEST" >> "$GITHUB_ENV"
          ls -lh "$DEST"

      - name: Start Appium (background) and wait port
        run: |
          nohup appium --log-level "${APPIUM_LOG_LEVEL}" > appium.log 2>&1 &
          for i in $(seq 1 90); do
            if lsof -i :4723 >/dev/null 2>&1; then
              echo "Appium está arriba en el puerto 4723"
              exit 0
            fi
            sleep 1
          done
          echo "Appium no inició a tiempo"
          exit 1

      - name: Run emulator + tests (Behave -> Allure)
        id: run-tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set +e
            adb devices

            # Instalación previa (si tu framework no instala con capability "app")
            if [ -n "${APK_PATH}" ] && [ -f "${APK_PATH}" ]; then
              adb install -r "${APK_PATH}" || echo "Aviso: la instalación podría manejarla Appium/capabilities"
            fi

            adb logcat -c || true
            mkdir -p allure-results

            behave -f allure_behave.formatter:AllureFormatter -o allure-results -f progress2
            BEHAVE_EXIT_CODE=$?

            adb logcat -d > logcat.txt || true
            echo "$BEHAVE_EXIT_CODE" > behave_exit_code.txt
            exit 0

      - name: Zip Allure results
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            zip -r allure-results.zip allure-results
          else
            echo "No se encontró allure-results"
          fi

      - name: Upload Allure results (.zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-zip
          path: allure-results.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload raw Allure folder (opcional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-folder
          path: allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Appium (best-effort)
        if: always()
        run: |
          pkill -f appium || true

      - name: Fail job if tests failed
        if: always()
        run: |
          code=$(cat behave_exit_code.txt 2>/dev/null || echo 0)
          echo "Behave exit code: $code"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
