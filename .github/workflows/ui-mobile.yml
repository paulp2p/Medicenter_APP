name: Android Behave Tests (macOS + APK desde Drive)

on:
  workflow_dispatch:
    inputs:
      behave_tags:
        description: 'Etiquetas Behave (ej: @smoke, @regression) — opcional'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
  API_LEVEL: 30
  AVD_NAME: ci-pixel5-api30
  DEVICE_PROFILE: pixel_5
  APK_LOCAL_NAME: medicenter_app.apk
  PY_VERSION: "3.11"

  # Appium
  USE_APPIUM: "true"
  APPIUM_HOST: "127.0.0.1"
  APPIUM_PORT: "4723"

  # Google Drive / rclone
  RCLONE_REMOTE: "gdrive"
  GDRIVE_APK_PATH: "CI/medicenter_app.apk"

  # App bajo test (opcional)
  APP_PACKAGE: "com.siltium.medicenter"
  APP_ACTIVITY: "com.siltium.medicenter.MainActivity"

jobs:
  android-behave:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node (Appium)
        if: env.USE_APPIUM == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          set -eux
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install behave selenium appium-python-client allure-behave
          fi

      # ---------- RCLONE (macOS) ----------
      - name: Instalar rclone
        run: |
          set -eux
          brew update
          brew install rclone

      - name: Configurar rclone (desde secreto base64)
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RCLONE_CONF_B64:-}" ] || { echo "Falta secrets.RCLONE_CONF_B64"; exit 1; }
          mkdir -p "${HOME}/.config/rclone"
          CLEAN="$(printf '%s' "$RCLONE_CONF_B64" | tr -d '\r\n\t ' )"
          PAD=$(( (4 - (${#CLEAN} % 4)) % 4 ))
          if [ $PAD -gt 0 ]; then CLEAN="${CLEAN}$(printf '=%.0s' $(seq 1 $PAD))"; fi
          printf '%s' "$CLEAN" | base64 -D > "${HOME}/.config/rclone/rclone.conf"
          rclone version
          rclone listremotes

      - name: "Smoke test: acceso a Drive y descarga de APK"
        run: |
          set -eux
          rclone ls "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}"
          rclone copyto "${RCLONE_REMOTE}:${GDRIVE_APK_PATH}" "${APK_LOCAL_NAME}"
          ls -lh "${APK_LOCAL_NAME}"

      # ---------- ANDROID SDK + EMULADOR (macOS) ----------
      - name: Instalar Android SDK (cmdline-tools) y componentes
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
          mkdir -p cmdline-tools
          unzip -q cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          rm -f cmdline-tools.zip

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"

          # Detectar ABI según arquitectura del runner
          ARCH="$(uname -m)"; ABI="x86_64"
          if [ "$ARCH" = "arm64" ]; then ABI="arm64-v8a"; fi
          echo "ABI=$ABI" >> "$GITHUB_ENV"

          yes | sdkmanager --licenses
          yes | sdkmanager \
            "platform-tools" "emulator" "platforms;android-${API_LEVEL}" \
            "build-tools;30.0.3" \
            "system-images;android-${API_LEVEL};google_apis;${ABI}"

          adb version
          emulator -version

      - name: Crear AVD
        run: |
          set -eux
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes "no" | avdmanager create avd \
            -n "$AVD_NAME" -k "system-images;android-${API_LEVEL};google_apis;${ABI}" \
            -d "$DEVICE_PROFILE" --force
          AVD_CFG="$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"
          {
            echo "hw.cpu.ncore=4"
            echo "hw.ramSize=4096"
            echo "vm.heapSize=576"
            echo "tag.id=google_apis"
            echo "image.sysdir.1=$ANDROID_SDK_ROOT/system-images/android-${API_LEVEL}/google_apis/${ABI}"
            echo "disk.dataPartition.size=4096M"
          } >> "$AVD_CFG"

      - name: Iniciar emulador (macOS headless) y esperar boot
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"

          : > emulator.log
          nohup emulator -avd "$AVD_NAME" \
            -no-window -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -noaudio -camera-back none -camera-front none \
            > emulator.log 2>&1 &

          adb start-server

          # Detectar serial y fail-fast si HVF está deshabilitado en este runner
          DEV=""
          for i in {1..90}; do
            if grep -qE 'HVF error|failed to initialize HVF|QEMU main loop exits abnormally' emulator.log; then
              echo "❌ Emulador no puede arrancar en este runner macOS (HVF deshabilitado)."
              tail -n +1 emulator.log || true
              exit 1
            fi
            DEV="$(adb devices | awk '/emulator-/{print $1; exit}')"
            [ -n "$DEV" ] && break || true
            sleep 2
          done
          if [ -z "${DEV:-}" ]; then
            echo "No se detectó ningún emulator-* a tiempo"
            tail -n +200 emulator.log || true
            exit 1
          fi
          echo "ANDROID_SERIAL=$DEV" >> "$GITHUB_ENV"

          # Esperar boot del framework (máx ~5 min)
          for i in {1..300}; do
            adb -s "$DEV" shell getprop sys.boot_completed 2>/dev/null | grep -q "1" && break || true
            sleep 1
          done
          adb -s "$DEV" shell getprop sys.boot_completed | grep -q "1" || {
            echo "El emulador no booteó a tiempo"
            tail -n +200 emulator.log || true
            exit 1
          }

      - name: Desbloquear y desactivar animaciones
        shell: bash
        run: |
          set -eux
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"
          [ -n "$dev" ] || { echo "No hay device emulado"; exit 1; }
          adb -s "$dev" shell input keyevent 224 || true
          adb -s "$dev" shell wm dismiss-keyguard || true
          adb -s "$dev" shell input keyevent 82 || true
          adb -s "$dev" shell input keyevent 3  || true
          adb -s "$dev" shell settings put global window_animation_scale 0 || true
          adb -s "$dev" shell settings put global transition_animation_scale 0 || true
          adb -s "$dev" shell settings put global animator_duration_scale 0 || true
          adb -s "$dev" shell svc power stayon true || true

      - name: Instalar y arrancar Appium (macOS)
        if: env.USE_APPIUM == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          NPM_BIN="$(npm bin -g || true)"
          [ -n "$NPM_BIN" ] && { echo "$NPM_BIN" >> "$GITHUB_PATH"; export PATH="$NPM_BIN:$PATH"; }
          node -v; npm -v

          npm i -g appium appium-uiautomator2-driver
          appium --version
          appium driver install uiautomator2 || true

          # Liberar puerto 4723 si quedó algo
          command -v lsof >/dev/null && lsof -ti tcp:4723 | xargs -r kill -9 || true

          : > appium.log
          nohup appium --allow-insecure=adb_shell \
            --address "$APPIUM_HOST" --port "$APPIUM_PORT" > appium.log 2>&1 &

          for i in $(seq 1 120); do
            if curl -fsS "http://$APPIUM_HOST:$APPIUM_PORT/status" >/dev/null; then
              echo "Appium OK en $APPIUM_HOST:$APPIUM_PORT"; break
            fi
            if ! pgrep -f "appium .*--port $APPIUM_PORT" >/dev/null; then
              echo "Appium se detuvo inesperadamente:"; tail -n +1 appium.log || true; exit 1
            fi
            sleep 1
          done

          curl -fsS "http://$APPIUM_HOST:$APPIUM_PORT/status" | head -c 500 \
            || { echo "Appium no responde en /status"; tail -n +200 appium.log || true; exit 1; }

      - name: Instalar APK en el emulador
        shell: bash
        run: |
          set -eux
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"
          [ -n "$dev" ] || { echo "No hay device emulado"; exit 1; }
          adb devices
          if [ -n "${APP_PACKAGE:-}" ]; then
            adb -s "$dev" uninstall "${APP_PACKAGE}" || true
          fi
          adb -s "$dev" install -r "${APK_LOCAL_NAME}" | tee adb-install.log

      - name: Ejecutar tests (Behave)
        if: env.USE_APPIUM == 'true'
        timeout-minutes: 55
        env:
          DEVICE_NAME: "${{ env.ANDROID_SERIAL }}"
          PLATFORM_NAME: "Android"
          AUTOMATION_NAME: "UiAutomator2"
          APPIUM_SERVER_URL: "http://${{ env.APPIUM_HOST }}:${{ env.APPIUM_PORT }}"
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
          APP_ACTIVITY: ${{ env.APP_ACTIVITY }}
        run: |
          set -eux
          export APP="${APK_LOCAL_NAME}"
          export ANDROID_INSTALL_TIMEOUT=600000
          export NO_RESET=true
          export ENFORCE_APP_INSTALL=false
          export ADB_EXEC_TIMEOUT=300000
          export UIA2_INSTALL_TIMEOUT=300000
          export UIA2_LAUNCH_TIMEOUT=300000
          mkdir -p reports/allure-results
          if [ -n "${{ github.event.inputs.behave_tags }}" ]; then
            behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results -t "${{ github.event.inputs.behave_tags }}"
          else
            behave -f allure_behave.formatter:AllureFormatter -o reports/allure-results
          fi

      - name: Capturar logcat para diagnóstico (macOS robusto)
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"
          : > logcat.txt
          if [ -z "${dev:-}" ]; then
            echo "[logcat] No hay device; omito captura" | tee -a logcat.txt
            exit 0
          fi
          if command -v gtimeout >/dev/null 2>&1; then
            gtimeout 60s adb -s "$dev" logcat -d -b all -v threadtime -T 10m >> logcat.txt || true
          else
            ( adb -s "$dev" logcat -d -b all -v threadtime -T 10m >> logcat.txt ) & pid=$!
            ( sleep 60; kill -9 $pid >/dev/null 2>&1 || true ) &
            wait $pid || true
          fi

      - name: Subir artefactos (Allure, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-logs
          path: |
            reports/allure-results/**
            appium.log
            adb-install.log
            emulator.log
            logcat.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Dump logs al fallar (consola)
        if: failure()
        shell: bash
        run: |
          set -eux
          test -f emulator.log && { echo "=== emulator.log (tail) ==="; tail -n 200 emulator.log; } || true
          test -f appium.log   && { echo "=== appium.log (tail) ===";   tail -n 200 appium.log;   } || true

      - name: Apagar emulador y limpiar
        if: always()
        shell: bash
        run: |
          set -eux
          dev="${ANDROID_SERIAL:-$(adb devices | awk '/emulator-/{print $1; exit}')}"
          if [ -n "$dev" ]; then adb -s "$dev" emu kill || true; fi
          pkill -f "emulator" || true
          pkill -f "appium" || true
          adb kill-server || true
