name: Android emulator smoke (manual SDK + AVD)

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: emulator-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd   # <- AVD fijo

    steps:
      # (cmdline-tools igual que ya tienes)

      - name: Install SDK packages
        run: |
          set -eux
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "platforms;android-30" \
            "system-images;android-30;google_apis;x86_64"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator"       >> "$GITHUB_PATH"

      - name: Create AVD (Pixel 5 • API 30 • google_apis x86_64)
        run: |
          set -eux
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            create avd -n ci_api30 \
            -k "system-images;android-30;google_apis;x86_64" \
            -d pixel_5 --force
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd || true
          ls -la "$ANDROID_AVD_HOME"
          test -f "$ANDROID_AVD_HOME/ci_api30.ini"  # <- falla aquí si no se creó

      - name: Boot emulator and collect logs
        shell: bash
        run: |
          set -eux
          SDK="$ANDROID_SDK_ROOT"
          ADB="$SDK/platform-tools/adb"
          EMU="$SDK/emulator/emulator"
          AVD_DIR="$ANDROID_AVD_HOME"
          SERIAL="emulator-5554"
          CONSOLE_PORT=5554

          # sanity: el .ini debe existir donde vamos a buscar
          test -f "$AVD_DIR/ci_api30.ini"

          $ADB kill-server || true
          $ADB start-server
          $ADB devices -l || true

          "$EMU" -avd ci_api30 -port ${CONSOLE_PORT} \
            -no-window -no-boot-anim -no-audio \
            -no-snapshot -no-snapshot-load -no-snapshot-save -wipe-data \
            -accel off -gpu swiftshader_indirect \
            -camera-back none -camera-front none \
            -verbose > emulator_stdout.log 2>&1 &

          EMU_PID=$!
          echo "EMU_PID=$EMU_PID"

          # Esperar a que aparezca el serial en adb devices
          for i in $(seq 1 300); do
            if $ADB devices | awk 'NR>1{print $1,$2}' | grep -q "^${SERIAL} device$"; then break; fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "El emulador murió antes de registrarse en ADB"; head -n 300 emulator_stdout.log; exit 1
            fi
            sleep 2
          done

          $ADB -s "$SERIAL" wait-for-device
          timeout 900 bash -c 'until '"$ADB"' -s '"$SERIAL"' shell getprop sys.boot_completed | grep -qm1 1; do sleep 2; done'
          $ADB -s "$SERIAL" shell 'until [ "$(getprop init.svc.bootanim)" = "stopped" ] || [ -z "$(getprop init.svc.bootanim)" ]; do sleep 1; done' || true

          $ADB version | tee adb_version.txt
          {
            echo "BOOT_OK=1"
            echo "SERIAL=$SERIAL"
            echo "MODEL=$($ADB -s "$SERIAL" shell getprop ro.product.model)"
            echo "ANDROID=$($ADB -s "$SERIAL" shell getprop ro.build.version.release)"
            echo "SDK=$($ADB -s "$SERIAL" shell getprop ro.build.version.sdk)"
            echo "ABI=$($ADB -s "$SERIAL" shell getprop ro.product.cpu.abi)"
          } | tee emulator-boot.log
          $ADB devices -l | tee adb_devices_after.txt
          $ADB -s "$SERIAL" logcat -d -t 200 > logcat_tail.txt || true

          $ADB -s "$SERIAL" emu kill || true
          timeout 30 tail --pid="$EMU_PID" -f /dev/null || true
